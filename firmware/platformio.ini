; Food truck firmware: PlatformIO project.
;
; Board: DFRobot FireBeetle 2 ESP32-E (DFR0654; ESP32-WROOM-32E, 4 MB flash, no PSRAM).
; Its PlatformIO id is "dfrobot_firebeetle2_esp32e" (from `pio boards firebeetle`).
;
; Build:            pio run
; Upload over USB:  pio run -t upload
; Debug build:      pio run -e truck-debug -t upload     then     pio device monitor
;
; Settings live in include/config.h. Any of them can be overridden here with a -D flag, or in a private file
; include/secrets.h (git-ignored).

[platformio]
default_envs = truck

[env]
; Pinned so the build is the same next year. 6.13.0 carries Arduino-ESP32 core 2.0.17.
platform = espressif32 @ 6.13.0
board = dfrobot_firebeetle2_esp32e
framework = arduino
; 80 MHz instead of 240: Wi-Fi and TLS still work, and the board draws less for the half minute it is awake
; (most of it spent waiting for the screen). Same setting as lmarzen/esp32-weather-epd, which runs this board.
board_build.f_cpu = 80000000L
monitor_speed = 115200
; Opening the serial monitor must not reset the board: two resets close together mean "open Wi-Fi set-up".
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    tzapu/WiFiManager @ 2.0.17
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=0

; The truck as it ships: no serial output at all.
[env:truck]
build_flags =
    ${env.build_flags}
    -DDEBUG_LOG=0

; The same program, but it says what it is doing on the serial port (115200 baud).
[env:truck-debug]
build_flags =
    ${env.build_flags}
    -DDEBUG_LOG=1
