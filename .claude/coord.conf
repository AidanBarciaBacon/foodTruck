# Board settings for this project, sourced by .claude/hooks/coord.sh. Plain bash assignments.
# Installed by the Bridge Crew extension; the meta pane (or you) fills it in for the project.

# 2026-11-12, at install: foodTruck is an empty repo (no code, no package.json, no remote, no commits before the
# board's own), so every setting below is left empty on purpose: there is nothing to check, build, guard or publish
# yet. Whoever scaffolds the project sets them in the same commit as the scaffold (see docs/COORDINATION.md).

# What 'coord.sh check' runs, in order, from the repo root. Empty skips it.
CHECK_TYPECHECK=""            # e.g. "npm run -s typecheck"
CHECK_TEST=""                 # e.g. "npm test -s"
CHECK_PATH_PREPEND=""         # a repo-relative dir put first on PATH for both, e.g. "tools/bin"

# Directories 'git add <dir>' refuses (besides the repo root), space-separated, repo-relative: the shared source trees
# where a whole-dir add would sweep in another session's half-done work.
SHARED_TREES=""               # e.g. "src src/components"

# Extra commands that count as a publish (only the supervisor may run them), as one extended regex.
PUBLISH_PATTERNS=""           # e.g. "(^|[;&| ])(npm publish|firebase deploy)([[:space:]]|$)"

# Extra commands that install a tool on this Mac (an app's build.sh, 'code --install-extension'), as one extended regex.
# The supervisor and meta may run them; the corners build without installing. Empty: installs aren't gated.
INSTALL_PATTERNS=""           # e.g. "(^|[;&|(])[[:space:]]*code[[:space:]]+(--?[A-Za-z-]+[[:space:]]+)*--install-extension"

# Commands that share build output, as one extended regex: they run one at a time, each as
# 'coord.sh run build -- <command>', which holds the build lock exactly while it runs. Empty: no build lock.
BUILD_PATTERNS=""             # e.g. "(^|[;&|(]|--)[[:space:]]*(npm[[:space:]]+run[[:space:]]+build|make)([[:space:]]|$)"

# Directories no session may change (reference repos), space-separated absolute paths.
COORD_SIBLINGS_CONF=""        # e.g. "$HOME/Desktop/reference-repo"

# Whether a corner pane (topLeft, topRight, bottomLeft, bottomRight) may put a popup question (AskUserQuestion) to the
# user. "off": refused, with a message to route it through the supervisor (for a user who doesn't watch the panes). The
# supervisor, meta and a session with no board name yet still ask. Empty: allowed. 'coord.sh gate off popup' overrides.
PANE_POPUPS=""                # "on" lets the corner panes put questions to the user in a dialog (refused by default)
