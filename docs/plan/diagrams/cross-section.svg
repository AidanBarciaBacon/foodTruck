<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect width="1200" height="900" fill="#FFFBF2"/>
<defs>
  <!-- the one arrowhead every dimension line shares -->
  <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 z" fill="#5F6B7A"/>
  </marker>
</defs>
<text x="40" y="56" font-size="26" font-weight="700" fill="#1F2933">Cross-section: a slice through the truck at the window</text>
<text x="40" y="84" font-size="15" fill="#5F6B7A">Cut across the truck at x = 97 mm, the middle of the ribbon cable, looking towards the rear. Serving side on the left. Scale 4.5 px = 1 mm.</text>

<!-- Placement: px x = 340 + 4.5 * y(mm), px y = 846 - 4.5 * z(mm). y = 0 is the serving face, z = 0 the desk. -->

<!-- Desk -->
<line x1="300" y1="846" x2="1151" y2="846" stroke="#1F2933" stroke-width="2"/>
<text x="440" y="831" font-size="13" fill="#5F6B7A">Desk, z = 0</text>

<!-- Beyond the slice (dashed): the rear wheels (y 0-12 and 115-127, z 0-32) and their wells (14 deep, cavity up to z = 33.6, 2.4 roof up to z = 36) -->
<g fill="none" stroke="#B8C0CC" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round">
  <rect x="340" y="702" width="54" height="144" rx="5"/>
  <rect x="857.5" y="702" width="54" height="144" rx="5"/>
  <polyline points="350.8,684 403,684 403,794.7"/>
  <line x1="350.8" y1="694.8" x2="403" y2="694.8"/>
  <polyline points="900.7,684 848.5,684 848.5,794.7"/>
  <line x1="900.7" y1="694.8" x2="848.5" y2="694.8"/>
</g>

<!-- Truck body, cut: floor z 9-11.4, walls 2.4 thick, window z 46.5-143.5 at the inner face; the outer 1.5 of the wall chamfered 45 degrees, so z 45-145 outside -->
<g fill="#FFE8CC" stroke="#1F2933" stroke-width="2" stroke-linejoin="round">
  <polygon points="340,805.5 911.5,805.5 911.5,172.8 900.7,172.8 900.7,794.7 350.8,794.7 350.8,636.75 346.75,636.75 340,643.5"/>
  <polygon points="340,193.5 346.75,200.25 350.8,200.25 350.8,172.8 340,172.8"/>

<!-- Roof lid z 149.6-152, with its 1.5 lip on the far side only (none over the sled) -->
  <polygon points="340,172.8 340,162 911.5,162 911.5,172.8 900.7,172.8 900.7,179.55 889.9,179.55 889.9,172.8"/>
</g>

<!-- Belt line z = 36: the seam between chassis and body shell -->
<line x1="340" y1="684" x2="350.8" y2="684" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="900.7" y1="684" x2="911.5" y2="684" stroke="#5F6B7A" stroke-width="1.25"/>

<!-- Battery 7.3 thick, z 40-90 (dashed: it sits at x 115-175, nearer the front than this slice), and the ribs of its pocket -->
<rect x="370.6" y="670.5" width="37.35" height="9" fill="#FFD8A8" stroke="#1F2933" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="370.6" y="427.5" width="37.35" height="9" fill="#FFD8A8" stroke="#1F2933" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="370.6" y="441" width="32.85" height="225" fill="#FFF3BF" stroke="#E67700" stroke-width="1.5" stroke-dasharray="6 4"/>

<!-- Main board (beyond, x 4-64): z 54.8-80.2, on 3 mm standoffs, so y 9.8-11.4 -->
<rect x="370.6" y="574.65" width="13.5" height="18" fill="#FFD8A8" stroke="#1F2933" stroke-width="1"/>
<rect x="370.6" y="491.85" width="13.5" height="18" fill="#FFD8A8" stroke="#1F2933" stroke-width="1"/>
<rect x="384.1" y="485.1" width="7.2" height="114.3" fill="#D3F9D8" stroke="#2F9E44" stroke-width="1.25" stroke-dasharray="4 3"/>

<!-- Sled backboard, cut: flat plate y 3.8-6.8, z 42-148.5 here (the cut-out takes z 36-42). The glass lies on its front face -->
<polygon points="357.1,177.75 370.6,177.75 370.6,657 357.1,657" fill="#FFD8A8" stroke="#1F2933" stroke-width="1.5" stroke-linejoin="round"/>

<!-- The plate beyond the cut-out, down to z = 36 where it stands on the well tops -->
<polyline points="357.1,657 357.1,684 370.6,684 370.6,657" fill="none" stroke="#B8C0CC" stroke-width="1.5" stroke-dasharray="3 3"/>

<!-- Screen glass, cut: y 2.9-3.8, z 36.5-147.7. Blue edge: the picture area, z 47-143 -->
<rect x="353.05" y="181.35" width="4.05" height="500.4" fill="#E7F5FF" stroke="#1F2933" stroke-width="0.75"/>
<line x1="353.05" y1="202.5" x2="353.05" y2="634.5" stroke="#1971C2" stroke-width="2"/>

<!-- Adapter board, cut (47 x 32, short side along the truck): its socket (z 51-56) takes the ribbon; board z 50-97 -->
<rect x="370.6" y="594" width="9" height="22.5" fill="#D3F9D8" stroke="#2F9E44" stroke-width="1.25"/>
<rect x="379.6" y="409.5" width="7.2" height="211.5" fill="#D3F9D8" stroke="#2F9E44" stroke-width="1.5"/>

<!-- Ribbon cable: leaves the glass at z = 36.5, half-turn of 1.75 radius (5.5 long), then straight up to z = 55 (24 long in all) -->
<path d="M357.1,681.75 A7.88,7.88 0 0 0 372.85,681.75 L372.85,598.5" fill="none" stroke="#1971C2" stroke-width="1.75"/>

<!-- Keep-out line at y = 37 -->
<line x1="506.5" y1="177.75" x2="506.5" y2="684" stroke="#5F6B7A" stroke-width="1.25" stroke-dasharray="3 4"/>

<!-- Magnet pair in a far-side corner post (dashed, beyond): 6 across x 3 thick each, meeting at z = 149.6 -->
<rect x="862.9" y="159.3" width="27" height="13.5" fill="none" stroke="#5F6B7A" stroke-width="1.25" stroke-dasharray="3 2.5"/>
<rect x="862.9" y="172.8" width="27" height="13.5" fill="none" stroke="#5F6B7A" stroke-width="1.25" stroke-dasharray="3 2.5"/>

<!-- The viewer's eye and two lines of sight, to the top (z = 143) and bottom (z = 47) of the picture -->
<g stroke="#E8590C" stroke-width="1.5" fill="none">
  <line x1="96" y1="137" x2="353.05" y2="202.5"/>
  <line x1="96" y1="137" x2="353.05" y2="634.5"/>
</g>
<path d="M58,137 Q77,120 96,137 Q77,154 58,137 z" fill="#FFFBF2" stroke="#1F2933" stroke-width="2" stroke-linejoin="round"/>
<circle cx="81" cy="137" r="6" fill="#1F2933"/>
<text x="40" y="108" font-size="15" fill="#1F2933">Viewer's eye (really much farther away)</text>
<text x="290" y="214" font-size="13" fill="#E8590C" text-anchor="end">Lines of sight</text>

<!-- Dimensions -->
<line x1="340" y1="159" x2="340" y2="113" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="911.5" y1="159" x2="911.5" y2="113" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="506.5" y1="159" x2="506.5" y2="139" stroke="#5F6B7A" stroke-width="1.25"/>
