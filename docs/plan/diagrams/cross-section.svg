<line x1="423.25" y1="144" x2="340" y2="144" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><line x1="423.25" y1="144" x2="506.5" y2="144" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="364.01" y="126" width="118.47" height="16" fill="#FFFBF2"/><text x="423.25" y="138" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle">37 mm (1.46 in)</text>
<text x="334" y="150" font-size="13" fill="#5F6B7A" text-anchor="end">y = 0</text>
<text x="918.5" y="150" font-size="13" fill="#5F6B7A">y = 127</text>
<line x1="337" y1="200.25" x2="311" y2="200.25" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="337" y1="636.75" x2="311" y2="636.75" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="337" y1="684" x2="311" y2="684" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="316" y1="418.5" x2="316" y2="200.25" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><line x1="316" y1="418.5" x2="316" y2="636.75" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="250.76" y="406.5" width="118.47" height="16" fill="#FFFBF2" transform="rotate(-90 310 418.5)"/><text x="310" y="418.5" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle" transform="rotate(-90 310 418.5)">97 mm (3.82 in)</text>
<line x1="316" y1="765" x2="316" y2="684" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><line x1="316" y1="765" x2="316" y2="846" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="250.76" y="778" width="118.47" height="16" fill="#FFFBF2" transform="rotate(-90 310 790)"/><text x="310" y="790" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle" transform="rotate(-90 310 790)">36 mm (1.42 in)</text>
<line x1="373.6" y1="181.35" x2="831" y2="181.35" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="373.6" y1="202.5" x2="785" y2="202.5" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="373.6" y1="634.5" x2="785" y2="634.5" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="412" y1="681.75" x2="831" y2="681.75" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="780" y1="418.5" x2="780" y2="202.5" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><line x1="780" y1="418.5" x2="780" y2="634.5" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="714.76" y="406.5" width="118.47" height="16" fill="#FFFBF2" transform="rotate(-90 774 418.5)"/><text x="774" y="418.5" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle" transform="rotate(-90 774 418.5)">96 mm (3.78 in)</text>
<line x1="780" y1="191.93" x2="780" y2="181.35" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><line x1="780" y1="191.93" x2="780" y2="202.5" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/>
<line x1="780" y1="658.13" x2="780" y2="634.5" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><line x1="780" y1="658.13" x2="780" y2="681.75" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/>
<rect x="652.8" y="185" width="122.4" height="16" fill="#FFFBF2"/><text x="714" y="197" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle">4.7 mm (0.19 in)</text>
<rect x="644.28" y="651" width="131.43" height="16" fill="#FFFBF2"/><text x="710" y="663" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle">10.5 mm (0.41 in)</text>
<line x1="826" y1="431.55" x2="826" y2="181.35" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><line x1="826" y1="431.55" x2="826" y2="681.75" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="749.77" y="419.55" width="140.46" height="16" fill="#FFFBF2" transform="rotate(-90 820 431.55)"/><text x="820" y="431.55" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle" transform="rotate(-90 820 431.55)">111.2 mm (4.38 in)</text>
<line x1="914.5" y1="162" x2="1151" y2="162" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="1146" y1="504" x2="1146" y2="162" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><line x1="1146" y1="504" x2="1146" y2="846" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="1080.76" y="492" width="118.47" height="16" fill="#FFFBF2" transform="rotate(-90 1140 504)"/><text x="1140" y="504" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle" transform="rotate(-90 1140 504)">152 mm (6.0 in)</text>
<line x1="882.7" y1="480" x2="900.7" y2="480" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><line x1="929.5" y1="480" x2="911.5" y2="480" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="936" y="485" font-size="14" fill="#1F2933" font-weight="600">2.4 mm (0.09 in)</text>

<!-- Labels, left: what the viewer sees through the window -->
<text x="290" y="250" font-size="15" fill="#1F2933" text-anchor="end">Air gap, 0.5 mm</text>
<path d="M295,245 L351.93,245" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="351.93" cy="245" r="1.5" fill="#5F6B7A"/>
<text x="290" y="285" font-size="15" fill="#1F2933" text-anchor="end">Screen glass</text>
<path d="M295,280 L355.08,280" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="355.08" cy="280" r="1.5" fill="#5F6B7A"/>
<text x="290" y="320" font-size="15" fill="#1F2933" text-anchor="end">Picture area</text>
<path d="M295,315 L353.05,315" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="353.05" cy="315" r="1.5" fill="#5F6B7A"/>
<text x="40" y="612" font-size="15" fill="#1F2933">Window opening, 97 mm tall inside,</text>
<text x="40" y="631" font-size="15" fill="#1F2933">100 mm outside: the outer 1.5 mm</text>
<text x="40" y="650" font-size="15" fill="#1F2933">of the wall is chamfered 45° so it</text>
<text x="40" y="669" font-size="15" fill="#1F2933">shades less from above</text>
<path d="M282,646 L343.38,640.13" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="343.38" cy="640.13" r="1.5" fill="#5F6B7A"/>
<text x="40" y="716" font-size="15" fill="#1F2933">Serving-side wall, 2.4 mm thick</text>
<path d="M262,711 L345.4,715.5" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="345.4" cy="715.5" r="1.5" fill="#5F6B7A"/>

<!-- Labels, in the cavity: the sled and what rides on its back -->
<text x="540" y="224" font-size="15" fill="#1F2933">Keep-out line: everything on the</text>
<text x="540" y="243" font-size="15" fill="#1F2933">sled stays within 37 mm of the</text>
<text x="540" y="262" font-size="15" fill="#1F2933">serving face (y = 37)</text>
<path d="M535,229 L506.5,229" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="506.5" cy="229" r="1.5" fill="#5F6B7A"/>
<text x="540" y="298" font-size="15" fill="#1F2933">Sled backboard, 3 mm thick:</text>
<text x="540" y="317" font-size="15" fill="#1F2933">lifts out through the roof</text>
<path d="M535,293 L363.85,293" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="363.85" cy="293" r="1.5" fill="#5F6B7A"/>
<text x="540" y="345" font-size="15" fill="#E8590C">At 152 mm tall the fit above</text>
<text x="540" y="364" font-size="15" fill="#E8590C">and below the glass is about</text>
<text x="540" y="383" font-size="15" fill="#E8590C">1 mm. 155 mm (6.1 in) is</text>
<text x="540" y="402" font-size="15" fill="#E8590C">recommended.</text>
<text x="540" y="432" font-size="15" fill="#1F2933" font-weight="600">Empty cavity</text>
<text x="540" y="450" font-size="13" fill="#5F6B7A">(nothing here but air and wires)</text>
<text x="540" y="482" font-size="15" fill="#1F2933">Battery, 7.3 mm thick, against</text>
<text x="540" y="501" font-size="15" fill="#1F2933">the sled in its pocket (dashed:</text>
<text x="540" y="520" font-size="15" fill="#1F2933">nearer the front than this slice)</text>
<path d="M535,477 L398.5,477" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="398.5" cy="477" r="1.5" fill="#5F6B7A"/>
<text x="540" y="548" font-size="15" fill="#1F2933">Main board on 3 mm standoffs</text>
<text x="540" y="567" font-size="15" fill="#1F2933">(beyond the slice)</text>
<path d="M535,543 L389.5,543" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="389.5" cy="543" r="1.5" fill="#5F6B7A"/>
<text x="540" y="596" font-size="15" fill="#1F2933">Adapter board: the ribbon</text>
<text x="540" y="615" font-size="15" fill="#1F2933">plugs into its socket</text>
<path d="M535,591 L383.2,591" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="383.2" cy="591" r="1.5" fill="#5F6B7A"/>
<text x="540" y="706" font-size="15" fill="#1F2933">Ribbon cable, folded back under</text>
<text x="540" y="725" font-size="15" fill="#1F2933">the glass through the sled's cut-out</text>
<path d="M535,701 L365.02,690.63" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="365.02" cy="690.63" r="1.5" fill="#5F6B7A"/>
<text x="540" y="756" font-size="15" fill="#1F2933">Wheel well (dashed): the sled</text>
<text x="540" y="775" font-size="15" fill="#1F2933">stands on its roof, z = 36</text>
<path d="M535,751 L403,751" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="403" cy="751" r="1.5" fill="#5F6B7A"/>
<text x="650" y="831" font-size="15" fill="#1F2933">Floor, 2.4 mm thick</text>
<path d="M645,826 L632,800.1" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="632" cy="800.1" r="1.5" fill="#5F6B7A"/>
<text x="530" y="151" font-size="15" fill="#1F2933">1.1 mm clear between the sled's top and the lid</text>
<path d="M526,147 L363.85,175.27" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="363.85" cy="175.27" r="1.5" fill="#5F6B7A"/>

<!-- Labels, right -->
<text x="945" y="195" font-size="15" fill="#1F2933">Roof lid, 2.4 mm thick,</text>
<text x="945" y="214" font-size="15" fill="#1F2933">lifts off</text>
<path d="M941,190 L905,167.4" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="905" cy="167.4" r="1.5" fill="#5F6B7A"/>
<text x="945" y="250" font-size="15" fill="#1F2933">Lip under the lid,</text>
<text x="945" y="269" font-size="15" fill="#1F2933">1.5 mm deep: far side</text>
<text x="945" y="288" font-size="15" fill="#1F2933">only, none over the sled</text>
<path d="M941,255 L895.3,176.18" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="895.3" cy="176.18" r="1.5" fill="#5F6B7A"/>
<text x="945" y="330" font-size="15" fill="#1F2933">Magnet pair, one of four</text>
<text x="945" y="349" font-size="15" fill="#1F2933">(dashed: far corner post).</text>
<text x="945" y="368" font-size="15" fill="#1F2933">Each 6 mm across x 3 mm:</text>
<text x="945" y="387" font-size="15" fill="#1F2933">thicker than the lid</text>
<path d="M941,335 L876.4,179.55" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="876.4" cy="179.55" r="1.5" fill="#5F6B7A"/>
<text x="945" y="430" font-size="15" fill="#1F2933">Far-side wall</text>
<path d="M941,425 L906.1,425" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="906.1" cy="425" r="1.5" fill="#5F6B7A"/>
<text x="945" y="668" font-size="15" fill="#1F2933">Belt line, z = 36:</text>
<text x="945" y="687" font-size="15" fill="#1F2933">chassis below,</text>
<text x="945" y="706" font-size="15" fill="#1F2933">body shell above</text>
<path d="M941,672 L906.1,684" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="906.1" cy="684" r="1.5" fill="#5F6B7A"/>
<text x="945" y="790" font-size="15" fill="#1F2933">Wheel, 32 mm across</text>
<text x="945" y="809" font-size="15" fill="#1F2933">x 12 mm wide (dashed:</text>
<text x="945" y="828" font-size="15" fill="#1F2933">beyond the slice)</text>
<path d="M941,812 L911.5,826" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="911.5" cy="826" r="1.5" fill="#5F6B7A"/>

<!-- Key and scale note -->
