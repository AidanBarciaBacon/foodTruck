<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 750" width="100%" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Two screen sizes, drawn on the truck</title>
  <desc>Two side views of the same desk food truck at the same scale. Left: the 7.3 inch screen, picture area 160 x 96 mm, filling the serving side. Right: the 4 inch screen, picture area 84.6 x 56.4 mm (to confirm), centred on the box part of the body.</desc>

  <!--
    Scale: 2.2 px = 1 mm. Each truck sits in a group whose origin is the rear face at desk level,
    so local px = (2.2 * x, -2.2 * z) with x and z in mm from docs/plan/SPEC.md section 9.
      body        x 0..229 -> 0..503.8      z 9..152 -> -19.8..-334.4
      belt line   z 36 -> -79.2
      wheel wells x 27..65, 164..202 -> 59.4..143, 360.8..444.4   z 9..36
      wheels      32 dia -> r 35.2, centres x 46, 183 -> 101.2, 402.6, axle z 16 -> -35.2
      cab         from x 185 -> 407 (windscreen rake and side window are schematic: no numbers in the spec)
      7.3 inch picture area  x 17.1..177.1 -> 37.62..389.62   z 47..143 -> -103.4..-314.6   (352 x 211.2 px)
      4 inch picture area    84.6 x 56.4 mm about x 97, z 95 -> 120.34..306.46, -146.96..-271.04 (186.12 x 124.08 px)
  -->

  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#5F6B7A"/>
    </marker>

    <!-- The truck, identical in both views. -->
    <g id="truck">
      <line x1="-6" y1="0" x2="509.8" y2="0" stroke="#B8C0CC" stroke-width="1.5"/>
      <rect x="59.4" y="-79.2" width="83.6" height="59.4" fill="#FFE8CC"/>
      <rect x="360.8" y="-79.2" width="83.6" height="59.4" fill="#FFE8CC"/>
      <path d="M0,-19.8 L0,-334.4 L468.6,-334.4 L503.8,-228.8 L503.8,-19.8 L444.4,-19.8 L444.4,-79.2 L360.8,-79.2 L360.8,-19.8 L143,-19.8 L143,-79.2 L59.4,-79.2 L59.4,-19.8 Z" fill="#FFE8CC" stroke="#1F2933" stroke-width="2" stroke-linejoin="round"/>
      <g stroke="#1F2933" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="0" y1="-79.2" x2="59.4" y2="-79.2"/>
        <line x1="143" y1="-79.2" x2="360.8" y2="-79.2"/>
        <line x1="444.4" y1="-79.2" x2="503.8" y2="-79.2"/>
        <line x1="59.4" y1="-19.8" x2="143" y2="-19.8"/>
        <line x1="360.8" y1="-19.8" x2="444.4" y2="-19.8"/>
        <line x1="407" y1="-79.2" x2="407" y2="-334.4"/>
        <path d="M420.2,-220 L420.2,-308 L464.2,-308 L490.6,-228.8 L490.6,-220 Z" fill="#FFFBF2"/>
      </g>
      <circle cx="101.2" cy="-35.2" r="35.2" fill="#FFD8A8" stroke="#1F2933" stroke-width="2"/>
      <circle cx="101.2" cy="-35.2" r="9" fill="#FFE8CC" stroke="#1F2933" stroke-width="1.5"/>
      <circle cx="402.6" cy="-35.2" r="35.2" fill="#FFD8A8" stroke="#1F2933" stroke-width="2"/>
      <circle cx="402.6" cy="-35.2" r="9" fill="#FFE8CC" stroke="#1F2933" stroke-width="1.5"/>
    </g>

    <!-- A sketch of what the screen shows, in a 160 x 96 box: a header band and three truck rows. -->
    <g id="content">
      <rect x="0" y="0" width="160" height="18" fill="#1971C2"/>
      <rect x="6" y="6" width="62" height="6" fill="#FFFBF2"/>
      <rect x="114" y="7" width="40" height="4" fill="#E7F5FF"/>

      <rect x="6" y="25" width="70" height="7" fill="#1F2933"/>
      <rect x="6" y="35" width="40" height="3.5" fill="#5F6B7A"/>
      <rect x="118" y="27" width="36" height="4.5" fill="#5F6B7A"/>
      <rect x="6" y="44.5" width="148" height="0.8" fill="#B8C0CC"/>

      <rect x="6" y="50" width="54" height="7" fill="#1F2933"/>
      <rect x="6" y="60" width="48" height="3.5" fill="#5F6B7A"/>
      <rect x="118" y="52" width="36" height="4.5" fill="#5F6B7A"/>
      <rect x="6" y="69.5" width="148" height="0.8" fill="#B8C0CC"/>

      <rect x="6" y="75" width="82" height="7" fill="#1F2933"/>
      <rect x="6" y="85" width="34" height="3.5" fill="#5F6B7A"/>
      <rect x="118" y="77" width="36" height="4.5" fill="#5F6B7A"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1200" height="750" fill="#FFFBF2"/>

  <text x="40" y="56" font-size="26" font-weight="700" fill="#1F2933">Two screen sizes, drawn on the truck</text>
  <text x="40" y="84" font-size="15" fill="#5F6B7A">Serving side, truck facing right. The same truck at the same scale: only the screen changes.</text>

  <!-- LEFT: 7.3 inch -->
  <g transform="translate(84,516)">
    <text x="0" y="-394" font-size="15" font-weight="700" fill="#1F2933">7.3 inch <tspan fill="#E8590C">(recommended)</tspan></text>

    <use xlink:href="#truck"/>

    <rect x="37.62" y="-314.6" width="352" height="211.2" fill="#E7F5FF"/>
    <use xlink:href="#content" transform="translate(37.62,-314.6) scale(2.2)"/>
    <rect x="37.62" y="-314.6" width="352" height="211.2" fill="none" stroke="#1971C2" stroke-width="2" stroke-linejoin="round"/>

    <!-- width -->
    <g stroke="#5F6B7A" stroke-width="1.25" fill="none">
      <line x1="37.62" y1="-317.6" x2="37.62" y2="-359"/>
      <line x1="389.62" y1="-317.6" x2="389.62" y2="-359"/>
      <line x1="213.62" y1="-356" x2="37.62" y2="-356" marker-end="url(#arrow)"/>
      <line x1="213.62" y1="-356" x2="389.62" y2="-356" marker-end="url(#arrow)"/>
    </g>
    <rect x="157.62" y="-379" width="112" height="18" fill="#FFFBF2"/>
    <text x="213.62" y="-364" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle">160 mm (6.3 in)</text>

    <!-- height -->
    <g stroke="#5F6B7A" stroke-width="1.25" fill="none">
      <line x1="34.62" y1="-314.6" x2="-21" y2="-314.6"/>
      <line x1="34.62" y1="-103.4" x2="-21" y2="-103.4"/>
      <line x1="-18" y1="-209" x2="-18" y2="-314.6" marker-end="url(#arrow)"/>
      <line x1="-18" y1="-209" x2="-18" y2="-103.4" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(-27,-209) rotate(-90)">
      <rect x="-52" y="-14" width="104" height="18" fill="#FFFBF2"/>
      <text x="0" y="0" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle">96 mm (3.8 in)</text>
    </g>

    <!-- notes -->
    <g font-size="15" fill="#1F2933">
      <circle cx="5" cy="31" r="2.5"/>
      <text x="16" y="36" font-weight="700">800 x 480 pixels</text>
      <circle cx="5" cy="53" r="2.5"/>
      <text x="16" y="58">Readable from across a desk</text>
      <circle cx="5" cy="75" r="2.5"/>
      <text x="16" y="80">Fills the whole side, like a menu board</text>
      <circle cx="5" cy="97" r="2.5"/>
      <text x="16" y="102">Needs the full 152 mm height</text>
    </g>
  </g>

  <!-- RIGHT: 4 inch -->
  <g transform="translate(650,516)">
    <text x="0" y="-394" font-size="15" font-weight="700" fill="#1F2933">4 inch</text>

    <use xlink:href="#truck"/>

    <rect x="120.34" y="-271.04" width="186.12" height="124.08" fill="#E7F5FF"/>
    <use xlink:href="#content" transform="translate(120.34,-271.04) scale(1.16325,1.2925)"/>
    <rect x="120.34" y="-271.04" width="186.12" height="124.08" fill="none" stroke="#1971C2" stroke-width="2" stroke-linejoin="round"/>

    <!-- width -->
    <g stroke="#5F6B7A" stroke-width="1.25" fill="none">
      <line x1="120.34" y1="-274.04" x2="120.34" y2="-359"/>
      <line x1="306.46" y1="-274.04" x2="306.46" y2="-359"/>
      <line x1="213.4" y1="-356" x2="120.34" y2="-356" marker-end="url(#arrow)"/>
      <line x1="213.4" y1="-356" x2="306.46" y2="-356" marker-end="url(#arrow)"/>
    </g>
    <rect x="111.4" y="-379" width="204" height="18" fill="#FFFBF2"/>
    <text x="213.4" y="-364" font-size="14" fill="#1F2933" text-anchor="middle"><tspan font-weight="600">84.6 mm (3.3 in)</tspan><tspan font-size="13" fill="#5F6B7A"> (to confirm)</tspan></text>

    <!-- height -->
    <g stroke="#5F6B7A" stroke-width="1.25" fill="none">
      <line x1="117.34" y1="-271.04" x2="-21" y2="-271.04"/>
      <line x1="117.34" y1="-146.96" x2="-21" y2="-146.96"/>
      <line x1="-18" y1="-209" x2="-18" y2="-271.04" marker-end="url(#arrow)"/>
      <line x1="-18" y1="-209" x2="-18" y2="-146.96" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(-27,-209) rotate(-90)">
      <rect x="-102" y="-14" width="204" height="18" fill="#FFFBF2"/>
      <text x="0" y="0" font-size="14" fill="#1F2933" text-anchor="middle"><tspan font-weight="600">56.4 mm (2.2 in)</tspan><tspan font-size="13" fill="#5F6B7A"> (to confirm)</tspan></text>
    </g>

    <!-- notes -->
    <g font-size="15" fill="#1F2933">
      <circle cx="5" cy="31" r="2.5"/>
      <text x="16" y="36" font-weight="700">600 x 400 pixels</text>
      <circle cx="5" cy="53" r="2.5"/>
      <text x="16" y="58">In scale with a real serving window</text>
      <circle cx="5" cy="75" r="2.5"/>
      <text x="16" y="80">Leaves room round it for an awning, a counter and painted detail</text>
      <circle cx="5" cy="97" r="2.5"/>
      <text x="16" y="102">Smaller text: two or three trucks at most</text>
      <circle cx="5" cy="119" r="2.5"/>
      <text x="16" y="124">Frees the height</text>
    </g>
    <text x="0" y="148" font-size="13" fill="#5F6B7A">(to confirm): size from retailer listings, not yet checked against a datasheet.</text>
  </g>

  <!-- Legend and scale -->
  <g font-size="13" fill="#5F6B7A">
    <rect x="40" y="693" width="14" height="14" fill="#FFE8CC" stroke="#1F2933" stroke-width="1"/>
    <text x="61" y="705">Printed truck body</text>
    <rect x="193" y="693" width="14" height="14" fill="#FFD8A8" stroke="#1F2933" stroke-width="1"/>
    <text x="214" y="705">Printed wheels</text>
    <rect x="322" y="693" width="14" height="14" fill="#E7F5FF" stroke="#1971C2" stroke-width="1.5"/>
    <text x="343" y="705">Screen picture area; the blocks sketch its layout (a header and three truck rows)</text>
    <text x="1160" y="705" text-anchor="end">Drawn to scale, 2.2 px = 1 mm</text>
  </g>
</svg>
