<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 900" width="100%"
     font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>What the screen shows</title>
  <desc>A mock-up of the 800 x 480 six-colour e-paper screen on a normal day, with its parts labelled, the six
  colours it can show, and thumbnails of its three other states. Truck names, hours and the web address are made up.</desc>

  <defs>
    <!--
      Everything inside these groups is the SCREEN, drawn in real screen pixels (800 x 480) and scaled down where it
      is used. It uses only the six screen colours from SPEC section 4, as flat fills:
      black #000000, white #FFFFFF, red #D0021B, yellow #F5D000, blue #1F4FD8, green #1E8E3E.
    -->

    <!-- The parts every state shares: header band, awning, footer. The date text is added per state. -->
    <g id="chrome">
      <rect width="800" height="480" fill="#FFFFFF"/>
      <!-- header -->
      <rect width="800" height="96" fill="#000000"/>
      <text x="30" y="65" font-size="48" font-weight="800" letter-spacing="1" fill="#FFFFFF">TODAY’S TRUCKS</text>
      <polygon points="512,0 800,0 800,96 488,96" fill="#F5D000"/>
      <!-- awning: red and white stripes, 32 px each, with a scalloped edge outlined in black -->
      <path fill="#D0021B" d="M0,96 h32 v12 a16,16 0 0 1 -32,0 z M64,96 h32 v12 a16,16 0 0 1 -32,0 z M128,96 h32 v12
        a16,16 0 0 1 -32,0 z M192,96 h32 v12 a16,16 0 0 1 -32,0 z M256,96 h32 v12 a16,16 0 0 1 -32,0 z
        M320,96 h32 v12 a16,16 0 0 1 -32,0 z M384,96 h32 v12 a16,16 0 0 1 -32,0 z M448,96 h32 v12
        a16,16 0 0 1 -32,0 z M512,96 h32 v12 a16,16 0 0 1 -32,0 z M576,96 h32 v12 a16,16 0 0 1 -32,0 z
        M640,96 h32 v12 a16,16 0 0 1 -32,0 z M704,96 h32 v12 a16,16 0 0 1 -32,0 z M768,96 h32 v12
        a16,16 0 0 1 -32,0 z"/>
      <path fill="none" stroke="#000000" stroke-width="3" d="M0,108 a16,16 0 0 0 32,0 a16,16 0 0 0 32,0 a16,16 0 0 0 32,0 a16,16 0 0 0 32,0 a16,16 0 0 0 32,0
        a16,16 0 0 0 32,0 a16,16 0 0 0 32,0 a16,16 0 0 0 32,0 a16,16 0 0 0 32,0 a16,16 0 0 0 32,0
        a16,16 0 0 0 32,0 a16,16 0 0 0 32,0 a16,16 0 0 0 32,0 a16,16 0 0 0 32,0 a16,16 0 0 0 32,0
        a16,16 0 0 0 32,0 a16,16 0 0 0 32,0 a16,16 0 0 0 32,0 a16,16 0 0 0 32,0 a16,16 0 0 0 32,0
        a16,16 0 0 0 32,0 a16,16 0 0 0 32,0 a16,16 0 0 0 32,0 a16,16 0 0 0 32,0 a16,16 0 0 0 32,0"/>
      <!-- footer -->
      <rect y="432" width="800" height="48" fill="#000000"/>
      <text x="32" y="464" font-size="22" font-weight="700" fill="#FFFFFF">Updated 6:31 AM</text>
      <rect x="232" y="446" width="36" height="20" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <rect x="270" y="451" width="5" height="10" fill="#FFFFFF"/>
      <rect x="237" y="451" width="7" height="10" fill="#FFFFFF"/>
      <rect x="246.500" y="451" width="7" height="10" fill="#FFFFFF"/>
      <rect x="256" y="451" width="7" height="10" fill="#FFFFFF"/>
      <text x="768" y="464" text-anchor="end" font-size="22" font-weight="700" fill="#F5D000">example.com/trucks</text>
    </g>

    <!-- Three truck rows (made-up trucks). -->
    <g id="rows">
      <text x="32" y="184" font-size="46" font-weight="800" fill="#000000">Taco Comet</text>
      <text x="32" y="218" font-size="24" font-weight="600" fill="#000000">Street tacos and burritos</text>
      <rect x="484" y="160" width="284" height="54" fill="#D0021B"/>
      <text x="626" y="196" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">11:00 AM – 2:00 PM</text>

      <rect x="32" y="235" width="736" height="2" fill="#000000"/>
      <text x="32" y="282" font-size="46" font-weight="800" fill="#000000">Noodle Lantern</text>
      <text x="32" y="316" font-size="24" font-weight="600" fill="#000000">Hand-pulled noodles</text>
      <rect x="484" y="258" width="284" height="54" fill="#1F4FD8"/>
      <text x="626" y="294" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">11:30 AM – 1:30 PM</text>

      <rect x="32" y="333" width="736" height="2" fill="#000000"/>
      <text x="32" y="380" font-size="46" font-weight="800" fill="#000000">Melt Wagon</text>
      <text x="32" y="414" font-size="24" font-weight="600" fill="#000000">Grilled cheese and soup</text>
      <rect x="484" y="356" width="284" height="54" fill="#1E8E3E"/>
      <text x="626" y="392" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">10:30 AM – 2:30 PM</text>
    </g>

    <!-- The normal state: a weekday with trucks. -->
    <g id="normal">
      <use xlink:href="#chrome"/>
      <text x="652" y="59" text-anchor="middle" font-size="30" font-weight="800" fill="#000000">Thursday, Nov 12</text>
      <use xlink:href="#rows"/>
    </g>

    <!-- State: no trucks today. -->
    <g id="state-none">
      <use xlink:href="#chrome"/>
      <text x="652" y="59" text-anchor="middle" font-size="30" font-weight="800" fill="#000000">Thursday, Nov 12</text>
      <text x="400" y="296" text-anchor="middle" font-size="80" font-weight="800" fill="#000000">No trucks today</text>
      <rect x="320" y="328" width="160" height="12" fill="#D0021B"/>
    </g>

    <!-- State: the morning job could not read the public truck page. Whole-screen card, date in the header. -->
    <g id="state-unread">
      <use xlink:href="#chrome"/>
      <text x="652" y="59" text-anchor="middle" font-size="30" font-weight="800" fill="#000000">Thursday, Nov 12</text>
      <rect x="32" y="152" width="736" height="260" fill="#F5D000"/>
      <text x="400" y="234" text-anchor="middle" font-size="62" font-weight="800" fill="#000000">Couldn’t read the</text>
      <text x="400" y="302" text-anchor="middle" font-size="62" font-weight="800" fill="#000000">truck list today</text>
      <rect x="320" y="326" width="160" height="8" fill="#000000"/>
      <text x="400" y="382" text-anchor="middle" font-size="34" font-weight="700" fill="#000000">Check the page on your phone</text>
    </g>

    <!-- State: battery nearly empty. A whole-screen card stored in the truck's own program (no header or footer). -->
    <g id="state-charge">
      <rect width="800" height="480" fill="#D0021B"/>
      <rect x="257" y="75" width="266" height="136" fill="none" stroke="#FFFFFF" stroke-width="14"/>
      <rect x="530" y="116" width="22" height="54" fill="#FFFFFF"/>
      <rect x="276" y="94" width="26" height="98" fill="#FFFFFF"/>
      <text x="400" y="338" text-anchor="middle" font-size="108" font-weight="800" fill="#FFFFFF">CHARGE ME</text>
      <text x="400" y="418" text-anchor="middle" font-size="36" font-weight="700" fill="#FFFFFF">Plug in the USB-C lead at the back</text>
    </g>
  </defs>

  <!-- paper -->
  <rect width="1200" height="900" fill="#FFFBF2"/>

  <text x="40" y="56" font-size="26" font-weight="700" fill="#1F2933">What the screen shows</text>
  <text x="40" y="84" font-size="15" fill="#5F6B7A">A normal weekday, then the other states. The truck names, hours and web address here are made up.</text>

  <!-- ===== The main mock-up: 800 x 480 screen pixels drawn 700 x 420 (true 5:3) ===== -->
  <g transform="translate(250,108) scale(0.875)">
    <use xlink:href="#normal"/>
  </g>
  <rect x="249" y="107" width="702" height="422" fill="none" stroke="#1F2933" stroke-width="2" stroke-linejoin="round"/>

  <!-- size note under the mock-up -->
  <text x="250" y="552" font-size="15" font-weight="600" fill="#1F2933">800 x 480 pixels, 160 x 96 mm</text>

  <!-- ===== Leaders: 1.25 px grey ink, a dot on the part (ringed in paper so it shows on any screen colour) ===== -->
  <g fill="none" stroke="#5F6B7A" stroke-width="1.25">
    <line x1="234" y1="150" x2="262" y2="150"/>
    <line x1="234" y1="255" x2="266" y2="255"/>
    <line x1="234" y1="292" x2="266" y2="292"/>
    <line x1="234" y1="357" x2="266" y2="357"/>
    <line x1="234" y1="507" x2="262" y2="507"/>
    <!-- right column -->
    <line x1="912" y1="272" x2="966" y2="272"/>
    <line x1="936" y1="507" x2="966" y2="507"/>
    <!-- battery mark: down out of the footer to a label under the mock-up -->
    <polyline points="505.500,507 505.500,547 510,547"/>
  </g>
  <g fill="#5F6B7A" stroke="#FFFBF2" stroke-width="1.5">
    <circle cx="262" cy="150" r="3.750"/>
    <circle cx="266" cy="255" r="3.750"/>
    <circle cx="266" cy="292" r="3.750"/>
    <circle cx="266" cy="357" r="3.750"/>
    <circle cx="262" cy="507" r="3.750"/>
    <circle cx="912" cy="272" r="3.750"/>
    <circle cx="936" cy="507" r="3.750"/>
    <circle cx="505.500" cy="507" r="3.750"/>
  </g>

  <!-- ===== Annotations, left column (right-aligned to x = 226) ===== -->
  <g text-anchor="end" fill="#1F2933" font-size="15" font-weight="600">
    <text x="226" y="155">Header</text>
    <text x="226" y="260">Truck name, large</text>
    <text x="226" y="297">Food type</text>
    <text x="226" y="362">One row per truck</text>
    <text x="226" y="512">Footer</text>
  </g>
  <g text-anchor="end" fill="#5F6B7A" font-size="13">
    <text x="226" y="173">“TODAY’S TRUCKS”</text>
    <text x="226" y="191">and the date</text>
    <text x="226" y="380">up to four at this size;</text>
    <text x="226" y="398">with five or six, the rows</text>
    <text x="226" y="416">shrink to fit; beyond six,</text>
    <text x="226" y="434">the last row reads “+2 more”</text>
    <text x="226" y="530">when the morning job</text>
    <text x="226" y="548">made this picture</text>
  </g>

  <!-- ===== Annotations, right column (left-aligned to x = 974) ===== -->
  <g fill="#1F2933" font-size="15" font-weight="600">
    <text x="974" y="277">Hours</text>
    <text x="974" y="328">Six flat colours only</text>
    <text x="974" y="512">Web address</text>
    <text x="516" y="552">Battery mark</text>
  </g>
  <g fill="#5F6B7A" font-size="13">
    <text x="974" y="346">photos and gradients</text>
    <text x="974" y="364">turn grainy</text>
    <text x="974" y="468">The real screen is duller.</text>
    <text x="974" y="530">of the page</text>
    <text x="516" y="570">stamped in by the truck: full, half or low</text>
  </g>

  <!-- swatch strip: the six screen colours -->
  <g stroke="#1F2933" stroke-width="1">
    <rect x="974.500" y="380.500" width="18" height="18" fill="#000000"/>
    <rect x="974.500" y="404.500" width="18" height="18" fill="#FFFFFF"/>
    <rect x="974.500" y="428.500" width="18" height="18" fill="#D0021B"/>
    <rect x="1068.500" y="380.500" width="18" height="18" fill="#F5D000"/>
    <rect x="1068.500" y="404.500" width="18" height="18" fill="#1F4FD8"/>
    <rect x="1068.500" y="428.500" width="18" height="18" fill="#1E8E3E"/>
  </g>
  <g fill="#1F2933" font-size="13">
    <text x="1000" y="394">black</text>
    <text x="1000" y="418">white</text>
    <text x="1000" y="442">red</text>
    <text x="1094" y="394">yellow</text>
    <text x="1094" y="418">blue</text>
    <text x="1094" y="442">green</text>
  </g>

  <!-- ===== The other states: three thumbnails, 340 x 204 each (true 5:3) ===== -->
  <text x="40" y="594" font-size="15" font-weight="700" fill="#1F2933">The other states</text>
  <text x="176" y="594" font-size="13" fill="#5F6B7A">There is no weekend card: Friday’s picture, with Friday’s date, stays up until Monday morning.</text>

  <g transform="translate(40,606) scale(0.425)"><use xlink:href="#state-none"/></g>
  <g transform="translate(430,606) scale(0.425)"><use xlink:href="#state-unread"/></g>
  <g transform="translate(820,606) scale(0.425)"><use xlink:href="#state-charge"/></g>
  <g fill="none" stroke="#1F2933" stroke-width="1.5" stroke-linejoin="round">
    <rect x="39.250" y="605.250" width="341.500" height="205.500"/>
    <rect x="429.250" y="605.250" width="341.500" height="205.500"/>
    <rect x="819.250" y="605.250" width="341.500" height="205.500"/>
  </g>

  <g fill="#1F2933" font-size="15" font-weight="600">
    <text x="40" y="832">No trucks today</text>
    <text x="430" y="832">Couldn’t read the truck list today</text>
    <text x="820" y="832">Charge me (battery nearly empty)</text>
  </g>
  <g fill="#5F6B7A" font-size="13">
    <text x="40" y="850">a weekday with nothing on the list</text>
    <text x="430" y="850">the public page changed or was down</text>
    <text x="820" y="850">drawn once; the truck then sleeps until charged</text>
  </g>
</svg>
