<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="900" fill="#FFFBF2"/>
  <defs>
    <!-- the one arrowhead every dimension line uses -->
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#5F6B7A"/>
    </marker>
  </defs>
  <text x="40" y="56" font-size="26" font-weight="700" fill="#1F2933">Top view, roof off: what is inside</text>
  <text x="40" y="84" font-size="15" fill="#5F6B7A">Looking straight down with the roof lid lifted off. Rear at the left, front at the right, the serving side (the screen) nearest you.</text>

  <!-- ============================================================
       THE TRUCK, drawn in millimetres straight from SPEC.md section 9 (the 155 mm truck).
       This group turns mm into px: px = 200 + 3.6 * x, py = 607.2 - 3.6 * y
       (x from the rear face, y from the serving side's outer face). Stroke widths are px / 3.6.
       ============================================================ -->
  <g transform="translate(200 607.2) scale(3.6 -3.6)" stroke-linejoin="round" fill="none">
    <!-- four wheel wells, below z = 36: x 27 to 65 and 164 to 202, y 0 to 14 and 113 to 127 -->
    <g stroke="#B8C0CC" stroke-width="0.4167" stroke-dasharray="1.6667 1.3889">
      <rect x="27" y="0" width="38" height="14"/>
      <rect x="164" y="0" width="38" height="14"/>
      <rect x="27" y="113" width="38" height="14"/>
      <rect x="164" y="113" width="38" height="14"/>
    </g>
    <!-- walls: outside 229 x 127, 2.4 thick -->
    <path fill-rule="evenodd" d="M0 0 H229 V127 H0 Z M2.4 2.4 V124.6 H226.6 V2.4 Z" fill="#FFE8CC" stroke="#1F2933" stroke-width="0.5556"/>
    <!-- window opening through the serving wall, chamfered 45 degrees through the whole wall: x 14.2 to 180.0
         at the outer face (y = 0), x 16.6 to 177.6 at the inner face (y = 2.4). The wall carries on above and below it. -->
    <path d="M13.9 -0.3 H180.3 L177.3 2.6999999999999997 H16.9 Z" fill="#FFFBF2"/>
    <path d="M14.2 0 L16.6 2.4 M180.0 0 L177.6 2.4" stroke="#1F2933" stroke-width="0.5556"/>
    <path d="M14.2 0 H180.0 M16.6 2.4 H177.6" stroke="#B8C0CC" stroke-width="0.4167" stroke-dasharray="1.6667 1.3889"/>
    <!-- charging slot through the rear wall: centre y = 14, 7.5 across (y 10.25 to 17.75); its 13 runs up the wall -->
    <rect x="-0.3" y="10.25" width="3" height="7.5" fill="#FFFBF2"/>
    <path d="M0 10.25 H2.4 M0 17.75 H2.4" stroke="#1F2933" stroke-width="0.5556"/>
    <!-- U-channels on the inside of the serving wall, y 2.4 to 9.1, closed ends at x = 7.6 and x = 186.6, gripping the
         plate's 2.5 mm bare strips. Walls 2 thick, slot 3.4 wide (y 3.7 to 7.1); the front lip is what is left, 1.3 -->
    <path d="M5.6 2.4 H10.1 V3.7 H7.6 V7.1 H10.1 V9.1 H5.6 Z" fill="#FFE8CC" stroke="#1F2933" stroke-width="0.3472"/>
    <path d="M188.6 2.4 H184.1 V3.7 H186.6 V7.1 H184.1 V9.1 H188.6 Z" fill="#FFE8CC" stroke="#1F2933" stroke-width="0.3472"/>
    <!-- four magnet posts, 9 square, magnets 6 diameter: two in the far-side corners, one in the serving-side front corner,
         one on the rear wall centred at y = 42 -->
    <g fill="#FFE8CC" stroke="#1F2933" stroke-width="0.3472">
      <rect x="2.4" y="115.6" width="9" height="9"/>
      <rect x="217.6" y="115.6" width="9" height="9"/>
      <rect x="217.6" y="2.4" width="9" height="9"/>
      <rect x="2.4" y="37.5" width="9" height="9"/>
    </g>
    <g fill="#FFFBF2" stroke="#1F2933" stroke-width="0.2778">
      <circle cx="6.9" cy="120.1" r="3"/>
      <circle cx="222.1" cy="120.1" r="3"/>
      <circle cx="222.1" cy="6.9" r="3"/>
      <circle cx="6.9" cy="42" r="3"/>
    </g>
    <!-- keep-out for the electronics behind the sled: x 4 to 187, y 6.9 to 38 -->
    <path d="M4 6.9 V38 H187 V6.9" stroke="#E8590C" stroke-width="0.4167" stroke-dasharray="1.6667 1.3889"/>
    <!-- cab from x = 188 -->
    <line x1="188" y1="38" x2="188" y2="124.6" stroke="#B8C0CC" stroke-width="0.4167" stroke-dasharray="1.6667 1.3889"/>
    <!-- screen glass: x 12.0 to 182.2, y 2.9 to 3.8 (0.5 air gap in front of it, y 2.4 to 2.9) -->
    <rect x="12.0" y="2.9" width="170.2" height="0.9" fill="#1971C2"/>
    <!-- the rim's two ends beside the glass: x 10.2 to 11.7 and 182.5 to 184.0, y 2.9 to 3.9
         (its top run, which lies over the glass edge, is left off) -->
    <g fill="#FFD8A8" stroke="#1F2933" stroke-width="0.2778">
      <rect x="10.2" y="2.9" width="1.5" height="1"/>
      <rect x="182.5" y="2.9" width="1.5" height="1"/>
    </g>
    <!-- sled backboard: x 7.6 to 186.6, y 3.9 to 6.9 (the 0.1 of tape, y 3.8 to 3.9, only shows in the magnified box) -->
    <rect x="7.6" y="3.9" width="179" height="3" fill="#FFD8A8" stroke="#1F2933" stroke-width="0.3472"/>
    <!-- main board (route B, 60 long): x 4 to 64, on 4 mm standoffs so y 10.9 to 12.5; USB-C port at its rear end,
         centre y = 14 (the port is drawn 7.3 long x 3.0 thick) -->
    <g fill="#FFD8A8" stroke="#1F2933" stroke-width="0.2778">
      <rect x="10.5" y="6.9" width="3" height="4"/>
      <rect x="54.5" y="6.9" width="3" height="4"/>
    </g>
    <g fill="#D3F9D8" stroke="#2F9E44" stroke-width="0.3472">
      <rect x="4" y="10.9" width="60" height="1.6"/>
      <rect x="4" y="12.5" width="7.3" height="3.0"/>
      <!-- adapter board at the bottom centre: x 81.1 to 113.1, from y = 6.9 (drawn 1.6 thick) -->
      <rect x="81.1" y="6.9" width="32" height="1.6"/>
    </g>
    <!-- battery, 60 long x 7.3 thick: x 115 to 175, against the plate so y 6.9 to 14.2 -->
    <rect x="115" y="6.9" width="60" height="7.3" fill="#FFF3BF" stroke="#E67700" stroke-width="0.3472"/>
    <!-- the slice shown magnified below -->
    <rect x="176.5" y="-0.3" width="9" height="7.4" stroke="#5F6B7A" stroke-width="0.2778"/>
  </g>

  <!-- ============ dimensions (px; every one is the spec number through the formulas above) ============ -->
  <g stroke="#5F6B7A" stroke-width="1.25" fill="none">
    <!-- extension lines, stopping 3 px short of the part -->
    <line x1="200" y1="147" x2="200" y2="117"/>
    <line x1="1024.4" y1="147" x2="1024.4" y2="117"/>
    <line x1="197" y1="150" x2="173" y2="150"/>
    <line x1="197" y1="158.64" x2="173" y2="158.64"/>
    <line x1="197" y1="556.8" x2="155" y2="556.8"/>
    <line x1="197" y1="607.2" x2="155" y2="607.2"/>
    <line x1="1027.4" y1="607.2" x2="1059.4" y2="607.2"/>
    <line x1="1027.4" y1="150" x2="1059.4" y2="150"/>
    <line x1="879.8" y1="470.4" x2="964.6" y2="470.4"/>

    <!-- overall length, overall width -->
    <line x1="612.2" y1="122" x2="200" y2="122" marker-end="url(#arrow)"/>
    <line x1="612.2" y1="122" x2="1024.4" y2="122" marker-end="url(#arrow)"/>
    <g stroke="none"><rect x="553.27" y="103" width="117.86" height="17" fill="#FFFBF2"/><text x="612.2" y="116" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2933">229 mm (9.0 in)</text></g>
    <line x1="1054.4" y1="378.6" x2="1054.4" y2="150" marker-end="url(#arrow)"/>
    <line x1="1054.4" y1="378.6" x2="1054.4" y2="607.2" marker-end="url(#arrow)"/>
    <g transform="translate(1047.4 378.6) rotate(-90)" stroke="none"><rect x="-58.93" y="-13" width="117.86" height="17" fill="#FFFBF2"/><text x="0" y="0" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2933">127 mm (5.0 in)</text></g>
    <!-- wall thickness (the far wall, y 124.6 to 127) -->
    <line x1="178" y1="134" x2="178" y2="150" marker-end="url(#arrow)"/>
    <line x1="178" y1="174.64" x2="178" y2="158.64" marker-end="url(#arrow)"/>
    <line x1="178" y1="150" x2="178" y2="158.64"/>
    <g stroke="none"><rect x="50.18" y="146.32" width="121.82" height="17" fill="#FFFBF2"/><text x="168" y="159.32" font-size="14" font-weight="600" text-anchor="end" fill="#1F2933">2.4 mm (0.09 in)</text></g>
    <!-- charging slot centre, y = 14 -->
    <line x1="160" y1="582" x2="160" y2="556.8" marker-end="url(#arrow)"/>
    <line x1="160" y1="582" x2="160" y2="607.2" marker-end="url(#arrow)"/>
    <g stroke="none"><rect x="36.14" y="574" width="117.86" height="17" fill="#FFFBF2"/><text x="150" y="587" font-size="14" font-weight="600" text-anchor="end" fill="#1F2933">14 mm (0.55 in)</text></g>
    <!-- depth kept for the sled and its electronics, y = 0 to 38 -->
    <line x1="959.6" y1="538.8" x2="959.6" y2="470.4" marker-end="url(#arrow)"/>
    <line x1="959.6" y1="538.8" x2="959.6" y2="607.2" marker-end="url(#arrow)"/>
    <g transform="translate(952.6 538.8) rotate(-90)" stroke="none"><rect x="-58.93" y="-13" width="117.86" height="17" fill="#FFFBF2"/><text x="0" y="0" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2933">38 mm (1.50 in)</text></g>
  </g>

  <!-- ============ labels ============ -->
  <text x="188" y="512.8" font-size="15" text-anchor="end" fill="#1F2933">Charging slot</text>
  <text x="188" y="529.8" font-size="13" text-anchor="end" fill="#5F6B7A">in the rear wall,</text>
  <text x="188" y="546.8" font-size="13" text-anchor="end" fill="#5F6B7A">7.5 across, 13 tall</text>
  <polyline points="192,542.8 204.32,556.8" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="204.32" cy="556.8" r="3" fill="#5F6B7A"/>

  <text x="221.6" y="499" font-size="15" fill="#1F2933">Main board</text>
  <text x="221.6" y="516" font-size="13" fill="#5F6B7A">on 4 mm standoffs; its USB-C port</text>
  <text x="221.6" y="533" font-size="13" fill="#5F6B7A">lines up with the charging slot</text>
  <polyline points="344,539 344,565.08" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="344" cy="565.08" r="3" fill="#5F6B7A"/>

  <text x="549.56" y="499" font-size="15" text-anchor="middle" fill="#1F2933">Adapter board</text>
  <text x="549.56" y="516" font-size="13" text-anchor="middle" fill="#5F6B7A">the screen's ribbon</text>
  <text x="549.56" y="533" font-size="13" text-anchor="middle" fill="#5F6B7A">plugs in here</text>
  <polyline points="549.56,539 549.56,579.48" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="549.56" cy="579.48" r="3" fill="#5F6B7A"/>

  <text x="722" y="499" font-size="15" text-anchor="middle" fill="#1F2933">Battery</text>
  <text x="722" y="516" font-size="13" text-anchor="middle" fill="#5F6B7A">50 x 60 x 7.3, in a pocket</text>
  <text x="722" y="533" font-size="13" text-anchor="middle" fill="#5F6B7A">with 1 mm clear all round</text>
  <polyline points="722,539 722,569.22" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="722" cy="569.22" r="3" fill="#5F6B7A"/>

  <text x="470" y="462.4" font-size="13" font-weight="600" fill="#E8590C">Keep-out for the sled's electronics: x 4 to 187, out to y = 38</text>

  <text x="248.6" y="440.4" font-size="13" fill="#5F6B7A">Fourth magnet post, centred at y = 42:</text>
  <text x="248.6" y="456.4" font-size="13" fill="#5F6B7A">the sled drops in at the corner</text>

  <text x="365.6" y="175.2" font-size="15" text-anchor="middle" fill="#1F2933">Wheel well</text>
  <text x="365.6" y="192.2" font-size="13" text-anchor="middle" fill="#5F6B7A">38 x 14, one of four</text>

  <text x="248.6" y="224" font-size="15" fill="#1F2933">Magnet post for the roof lid, one of four (9 square, magnets 6 dia x 3)</text>
  <text x="248.6" y="242" font-size="13" fill="#5F6B7A">Two in the far corners, one in the cab, one on the rear wall.</text>
  <polyline points="244.6,214 234.56,185.28" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="234.56" cy="185.28" r="3" fill="#5F6B7A"/>

  <text x="542" y="322" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2933">Empty cavity</text>
  <text x="542" y="342" font-size="13" text-anchor="middle" fill="#5F6B7A">x 2.4 to 226.6, y 38 to 124.6: 224.2 x 86.6 mm of open floor</text>
  <text x="542" y="359" font-size="13" text-anchor="middle" fill="#5F6B7A">(the two far-side wheel wells stand in it, below z = 36)</text>

  <text x="886.8" y="247.2" font-size="15" fill="#1F2933">Cab, from x = 188</text>
  <text x="886.8" y="264.2" font-size="13" fill="#5F6B7A">the front of the truck</text>
  <text x="188" y="337.2" font-size="15" text-anchor="end" fill="#1F2933">Rear wall</text>

  <text x="150" y="627" font-size="13" fill="#1F2933">U-channel, one at each end of the sled</text>
  <polyline points="223.76,615 223.76,587.76" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="223.76" cy="587.76" r="3" fill="#5F6B7A"/>
  <text x="420" y="627" font-size="13" fill="#1F2933">Window opening: 161 wide at the inner face, 165.8 at the outer</text>
  <text x="420" y="643" font-size="13" fill="#5F6B7A">(the wall carries on above and below it)</text>
  <polyline points="549.56,615 549.56,602.88" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="549.56" cy="602.88" r="3" fill="#5F6B7A"/>

  <!-- ============ magnified 8 times: the stack at the serving wall, a slice x 176.5 to 185.5, y -0.3 to 7.1 ============
       px = 740 + 28.8 * (x - 176.5), py = 846.36 - 28.8 * y -->
  <polyline points="851.6,641.88 851.6,608.28" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="851.6" cy="608.28" r="3" fill="#5F6B7A"/>
  <text x="861.6" y="632.88" font-size="13" fill="#1F2933">Magnified 8 times</text>
  <rect x="740" y="641.88" width="259.2" height="213.12" fill="#FFFBF2"/>
  <g transform="translate(-4343.2 846.36) scale(28.8 -28.8)" fill="none">
    <!-- serving wall, y 0 to 2.4: the window's chamfered edge runs from x = 180.0 at the outer face to x = 177.6 at the inner face;
         the U-channel's front lip stands on the inner face from x = 184.1, up to y = 3.7 -->
    <path d="M180.0 0 H185.5 V3.7 H184.1 V2.4 H177.6 Z" fill="#FFE8CC"/>
    <path d="M185.5 0 H180.0 L177.6 2.4 H184.1 V3.7 H185.5" stroke="#1F2933" stroke-width="0.0694" stroke-linejoin="round"/>
    <path d="M176.5 0 H180.0 M176.5 2.4 H177.6" stroke="#B8C0CC" stroke-width="0.0521" stroke-dasharray="0.2083 0.1736"/>
    <!-- screen glass, y 2.9 to 3.8, ends at x = 182.2 -->
    <rect x="176.5" y="2.9" width="5.7" height="0.9" fill="#E7F5FF"/>
    <path d="M176.5 2.9 H182.2 V3.8" stroke="#1971C2" stroke-width="0.0521"/>
    <!-- double-sided tape, y 3.8 to 3.9 -->
    <rect x="176.5" y="3.8" width="5.7" height="0.1" fill="#5F6B7A"/>
    <!-- sled backboard, y 3.9 to 6.9, with the rim on its front face: x 182.5 to 184.0, down to y = 2.9, 0.3 clear of the glass end -->
    <path d="M176.5 3.9 H182.5 V2.9 H184.0 V3.9 H185.5 V6.9 H176.5 Z" fill="#FFD8A8"/>
    <path d="M176.5 3.9 H182.5 V2.9 H184.0 V3.9 H185.5 M176.5 6.9 H185.5" stroke="#1F2933" stroke-width="0.0521" stroke-linejoin="round"/>
  </g>
  <rect x="740" y="641.88" width="259.2" height="213.12" fill="none" stroke="#5F6B7A" stroke-width="1"/>
  <g stroke="#5F6B7A" stroke-width="1.25">
    <line x1="999.2" y1="846.36" x2="1006.2" y2="846.36"/>
    <line x1="999.2" y1="777.24" x2="1006.2" y2="777.24"/>
    <line x1="999.2" y1="762.84" x2="1006.2" y2="762.84"/>
    <line x1="999.2" y1="736.92" x2="1006.2" y2="736.92"/>
    <line x1="999.2" y1="734.04" x2="1006.2" y2="734.04"/>
    <line x1="999.2" y1="647.64" x2="1006.2" y2="647.64"/>
  </g>
  <text x="1011.2" y="850.86" font-size="13" font-weight="600" fill="#1F2933">y = 0</text>
  <text x="1011.2" y="783.74" font-size="13" font-weight="600" fill="#1F2933">y = 2.4</text>
  <text x="1011.2" y="765.34" font-size="13" font-weight="600" fill="#1F2933">y = 2.9</text>
  <text x="1011.2" y="737.98" font-size="13" font-weight="600" fill="#1F2933">y = 3.8 and 3.9</text>
  <text x="1011.2" y="652.14" font-size="13" font-weight="600" fill="#1F2933">y = 6.9</text>
  <text x="1011.2" y="678" font-size="13" fill="#1F2933">Rim round the glass:</text>
  <text x="1011.2" y="694" font-size="13" fill="#5F6B7A">1 high, 1.5 wide,</text>
  <text x="1011.2" y="710" font-size="13" fill="#5F6B7A">0.3 clear of it</text>
  <polyline points="1007.2,690 934.4,748.44" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="934.4" cy="748.44" r="3" fill="#5F6B7A"/>
  <text x="1011.2" y="810" font-size="13" fill="#1F2933">Front lip of the</text>
  <text x="1011.2" y="826" font-size="13" fill="#1F2933">U-channel</text>
  <polyline points="1007.2,810 979.04,758.52" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="979.04" cy="758.52" r="3" fill="#5F6B7A"/>

  <text x="726" y="695.34" font-size="13" text-anchor="end" fill="#1F2933">Sled backboard, 3 thick</text>
  <polyline points="732,690.84 760.16,690.84" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="760.16" cy="690.84" r="3" fill="#5F6B7A"/>
  <text x="726" y="732.98" font-size="13" text-anchor="end" fill="#1F2933">Double-sided tape, 0.1 thick</text>
  <polyline points="732,728.48 760.16,735.48" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="760.16" cy="735.48" r="3" fill="#5F6B7A"/>
  <text x="726" y="754.38" font-size="13" text-anchor="end" fill="#1F2933">Screen glass, 0.91 thick</text>
  <polyline points="732,749.88 760.16,749.88" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="760.16" cy="749.88" r="3" fill="#5F6B7A"/>
  <text x="726" y="774.54" font-size="13" text-anchor="end" fill="#1F2933">Air gap, 0.5</text>
  <polyline points="732,770.04 826.4,770.04" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="826.4" cy="770.04" r="3" fill="#5F6B7A"/>
  <text x="726" y="804.78" font-size="13" text-anchor="end" fill="#1F2933">Window opening, edge chamfered 45°</text>
  <polyline points="732,800.28 760.16,800.28" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="760.16" cy="800.28" r="3" fill="#5F6B7A"/>
  <text x="726" y="830.7" font-size="13" text-anchor="end" fill="#1F2933">Serving wall, 2.4 thick</text>
  <polyline points="732,826.2 886.88,826.2" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="886.88" cy="826.2" r="3" fill="#5F6B7A"/>

  <!-- ============ legend, scale note ============ -->
  <rect x="40" y="657" width="26" height="13" fill="#FFE8CC" stroke="#1F2933" stroke-width="1.5"/>
  <text x="76" y="668" font-size="13" fill="#1F2933">Truck body: walls, U-channels, magnet posts</text>
  <rect x="40" y="677" width="26" height="13" fill="#FFD8A8" stroke="#1F2933" stroke-width="1.5"/>
  <text x="76" y="688" font-size="13" fill="#1F2933">Sled backboard, its rim and its standoffs</text>
  <line x1="40" y1="704" x2="66" y2="704" stroke="#1971C2" stroke-width="3.24"/>
  <text x="76" y="708" font-size="13" fill="#1F2933">Screen glass, at its true thickness</text>
  <line x1="40" y1="724" x2="66" y2="724" stroke="#B8C0CC" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="76" y="728" font-size="13" fill="#1F2933">Hidden edge or the edge of a zone</text>

  <text x="40" y="762" font-size="13" fill="#5F6B7A">Drawn to scale: 3.6 px = 1 mm. The magnified box is 8 times that.</text>
  <text x="40" y="779" font-size="13" fill="#5F6B7A">The serving wall and the screen are shown cut at window height.</text>
  <text x="40" y="812" font-size="13" fill="#5F6B7A">The thickness of the boards, the USB-C port and the size of</text>
  <text x="40" y="829" font-size="13" fill="#5F6B7A">the adapter board are drawn at likely sizes: measure the</text>
  <text x="40" y="846" font-size="13" fill="#5F6B7A">real parts before modelling.</text>
</svg>
