<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="900" fill="#FFFBF2"/>
  <defs>
    <!-- the one arrowhead every dimension line uses -->
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0 0 L9 3.5 L0 7 Z" fill="#5F6B7A"/>
    </marker>
  </defs>
  <text x="40" y="56" font-size="26" font-weight="700" fill="#1F2933">Top view, roof off: what is inside</text>
  <text x="40" y="84" font-size="15" fill="#5F6B7A">Looking straight down with the roof lid lifted off. Rear at the left, front at the right, the serving side (the screen) nearest you.</text>

  <!-- ============================================================
       THE TRUCK, drawn in millimetres straight from SPEC.md section 9.
       This group turns mm into px: px = 200 + 3.6 * x, py = 607.2 - 3.6 * y
       (x from the rear face, y from the serving side's outer face). Stroke widths are px / 3.6.
       ============================================================ -->
  <g transform="translate(200 607.2) scale(3.6 -3.6)" stroke-linejoin="round" fill="none">
    <!-- four wheel wells, below z = 36: x 27 to 65 and 164 to 202, y 0 to 14 and 113 to 127 -->
    <g stroke="#B8C0CC" stroke-width="0.4167" stroke-dasharray="1.6667 1.3889">
      <rect x="27" y="0" width="38" height="14"/>
      <rect x="164" y="0" width="38" height="14"/>
      <rect x="27" y="113" width="38" height="14"/>
      <rect x="164" y="113" width="38" height="14"/>
    </g>
    <!-- walls: outside 229 x 127, 2.4 thick -->
    <path fill-rule="evenodd" d="M0 0 H229 V127 H0 Z M2.4 2.4 V124.6 H226.6 V2.4 Z" fill="#FFE8CC" stroke="#1F2933" stroke-width="0.5556"/>
    <!-- window opening through the serving wall: x 16.6 to 177.6 (the wall carries on above and below it) -->
    <rect x="16.6" y="-0.3" width="161" height="3" fill="#FFFBF2"/>
    <path d="M16.6 0 V2.4 M177.6 0 V2.4" stroke="#1F2933" stroke-width="0.5556"/>
    <path d="M16.6 0 H177.6 M16.6 2.4 H177.6" stroke="#B8C0CC" stroke-width="0.4167" stroke-dasharray="1.6667 1.3889"/>
    <!-- charging hole through the rear wall: centre y = 13 (drawn 7.5 across, the 13 running up the wall) -->
    <rect x="-0.3" y="9.25" width="3" height="7.5" fill="#FFFBF2"/>
    <path d="M0 9.25 H2.4 M0 16.75 H2.4" stroke="#1F2933" stroke-width="0.5556"/>
    <!-- U-channels on the inside of the serving wall, gripping 2.5 mm of the sled at x = 9.1 and x = 185.1
         (their own wall thickness is not in the spec: drawn 2) -->
    <path d="M7.1 2.4 H11.6 V3.8 H9.1 V6.8 H11.6 V8.8 H7.1 Z" fill="#FFE8CC" stroke="#1F2933" stroke-width="0.3472"/>
    <path d="M187.1 2.4 H182.6 V3.8 H185.1 V6.8 H182.6 V8.8 H187.1 Z" fill="#FFE8CC" stroke="#1F2933" stroke-width="0.3472"/>
    <!-- four magnet posts, magnets 6 diameter (post size and places are not in the spec: drawn 9 square) -->
    <g fill="#FFE8CC" stroke="#1F2933" stroke-width="0.3472">
      <rect x="2.4" y="115.6" width="9" height="9"/>
      <rect x="217.6" y="115.6" width="9" height="9"/>
      <rect x="217.6" y="2.4" width="9" height="9"/>
      <rect x="2.4" y="38" width="9" height="9"/>
    </g>
    <g fill="#FFFBF2" stroke="#1F2933" stroke-width="0.2778">
      <circle cx="6.9" cy="120.1" r="3"/>
      <circle cx="222.1" cy="120.1" r="3"/>
      <circle cx="222.1" cy="6.9" r="3"/>
      <circle cx="6.9" cy="42.5" r="3"/>
    </g>
    <!-- keep-out for the electronics on the back of the sled: x 4 to 185, y 6.8 to 37 -->
    <path d="M4 6.8 V37 H185 V6.8" stroke="#E8590C" stroke-width="0.4167" stroke-dasharray="1.6667 1.3889"/>
    <!-- cab from x = 185 -->
    <line x1="185" y1="37" x2="185" y2="124.6" stroke="#B8C0CC" stroke-width="0.4167" stroke-dasharray="1.6667 1.3889"/>
    <!-- screen glass: x 12.0 to 182.2, y 2.9 to 3.8 (0.5 air gap in front of it, y 2.4 to 2.9) -->
    <rect x="12" y="2.9" width="170.2" height="0.9" fill="#1971C2"/>
    <!-- sled backboard: x 9.1 to 185.1, y 3.8 to 6.8 -->
    <rect x="9.1" y="3.8" width="176" height="3" fill="#FFD8A8" stroke="#1F2933" stroke-width="0.3472"/>
    <!-- main board (route B, 60 long): x 4 to 64, on 3 mm standoffs so from y = 9.8; USB-C port at its rear end, centre y = 13
         (board and port thickness are not in the spec: drawn 1.6 and 3.2) -->
    <g fill="#FFD8A8" stroke="#1F2933" stroke-width="0.2778">
      <rect x="14" y="6.8" width="4" height="3"/>
      <rect x="54" y="6.8" width="4" height="3"/>
    </g>
    <g fill="#D3F9D8" stroke="#2F9E44" stroke-width="0.3472">
      <rect x="4" y="9.8" width="60" height="1.6"/>
      <rect x="4" y="11.4" width="7.3" height="3.2"/>
      <!-- adapter board at the centre (x = 97.1), size not in the spec for route B: drawn 32 long -->
      <rect x="81.1" y="6.8" width="32" height="1.6"/>
    </g>
    <!-- battery, 60 long x 7.3 thick: x 115 to 175, against the sled so y 6.8 to 14.1 -->
    <rect x="115" y="6.8" width="60" height="7.3" fill="#FFF3BF" stroke="#E67700" stroke-width="0.3472"/>
    <!-- the slice shown magnified below -->
    <rect x="175.5" y="-0.3" width="7" height="7.5" stroke="#5F6B7A" stroke-width="0.2778"/>
  </g>

  <!-- ============ dimensions (px; every one is the spec number through the formulas above) ============ -->
  <g stroke="#5F6B7A" stroke-width="1.25" fill="none">
    <!-- extension lines, stopping 3 px short of the part -->
    <line x1="200" y1="147" x2="200" y2="117"/>
    <line x1="1024.4" y1="147" x2="1024.4" y2="117"/>
    <line x1="197" y1="150" x2="173" y2="150"/>
    <line x1="197" y1="158.64" x2="173" y2="158.64"/>
    <line x1="197" y1="560.4" x2="155" y2="560.4"/>
    <line x1="197" y1="607.2" x2="155" y2="607.2"/>
    <line x1="1027.4" y1="607.2" x2="1059.4" y2="607.2"/>
    <line x1="1027.4" y1="150" x2="1059.4" y2="150"/>
    <line x1="869" y1="474" x2="964.6" y2="474"/>

    <!-- overall length, overall width -->
    <line x1="612.2" y1="122" x2="200" y2="122" marker-end="url(#arrow)"/>
    <line x1="612.2" y1="122" x2="1024.4" y2="122" marker-end="url(#arrow)"/>
    <g stroke="none"><rect x="554.18" y="103" width="116.05" height="17" fill="#FFFBF2"/><text x="612.2" y="116" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2933">229 mm (9.0 in)</text></g>
    <line x1="1054.4" y1="378.6" x2="1054.4" y2="150" marker-end="url(#arrow)"/>
    <line x1="1054.4" y1="378.6" x2="1054.4" y2="607.2" marker-end="url(#arrow)"/>
    <g transform="translate(1047.4 378.6) rotate(-90)" stroke="none"><rect x="-58.02" y="-13" width="116.05" height="17" fill="#FFFBF2"/><text x="0" y="0" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2933">127 mm (5.0 in)</text></g>
    <!-- wall thickness (the far wall, y 124.6 to 127) -->
    <line x1="178" y1="134" x2="178" y2="150" marker-end="url(#arrow)"/>
    <line x1="178" y1="174.64" x2="178" y2="158.64" marker-end="url(#arrow)"/>
    <line x1="178" y1="150" x2="178" y2="158.64"/>
    <g stroke="none"><rect x="51.99" y="146.32" width="120.01" height="17" fill="#FFFBF2"/><text x="168" y="159.32" font-size="14" font-weight="600" text-anchor="end" fill="#1F2933">2.4 mm (0.09 in)</text></g>
    <!-- charging hole centre, y = 13 -->
    <line x1="160" y1="583.8" x2="160" y2="560.4" marker-end="url(#arrow)"/>
    <line x1="160" y1="583.8" x2="160" y2="607.2" marker-end="url(#arrow)"/>
    <g stroke="none"><rect x="37.95" y="575.8" width="116.05" height="17" fill="#FFFBF2"/><text x="150" y="588.8" font-size="14" font-weight="600" text-anchor="end" fill="#1F2933">13 mm (0.51 in)</text></g>
    <!-- depth kept for the sled and its electronics, y = 0 to 37 -->
    <line x1="959.6" y1="540.6" x2="959.6" y2="474" marker-end="url(#arrow)"/>
    <line x1="959.6" y1="540.6" x2="959.6" y2="607.2" marker-end="url(#arrow)"/>
    <g transform="translate(952.6 534.6) rotate(-90)" stroke="none"><rect x="-58.02" y="-13" width="116.05" height="17" fill="#FFFBF2"/><text x="0" y="0" font-size="14" font-weight="600" text-anchor="middle" fill="#1F2933">37 mm (1.46 in)</text></g>
  </g>

  <!-- ============ labels ============ -->
  <text x="188" y="516.4" font-size="15" text-anchor="end" fill="#1F2933">Charging hole</text>
  <text x="188" y="533.4" font-size="13" text-anchor="end" fill="#5F6B7A">in the rear wall,</text>
  <text x="188" y="550.4" font-size="13" text-anchor="end" fill="#5F6B7A">a slot 7.5 across, 13 tall</text>
  <polyline points="192,546.4 204.32,560.4" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="204.32" cy="560.4" r="3" fill="#5F6B7A"/>

  <text x="221.6" y="499" font-size="15" fill="#1F2933">Main board</text>
  <text x="221.6" y="516" font-size="13" fill="#5F6B7A">on 3 mm standoffs; its USB-C port</text>
  <text x="221.6" y="533" font-size="13" fill="#5F6B7A">lines up with the charging hole</text>
  <polyline points="344,539 344,569.04" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="344" cy="569.04" r="3" fill="#5F6B7A"/>

  <text x="549.56" y="499" font-size="15" text-anchor="middle" fill="#1F2933">Adapter board</text>
  <text x="549.56" y="516" font-size="13" text-anchor="middle" fill="#5F6B7A">the screen's ribbon</text>
  <text x="549.56" y="533" font-size="13" text-anchor="middle" fill="#5F6B7A">plugs in here</text>
  <polyline points="549.56,539 549.56,579.84" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="549.56" cy="579.84" r="3" fill="#5F6B7A"/>

  <text x="722" y="499" font-size="15" text-anchor="middle" fill="#1F2933">Battery</text>
  <text x="722" y="516" font-size="13" text-anchor="middle" fill="#5F6B7A">50 x 60 x 7.3, in a pocket</text>
  <text x="722" y="533" font-size="13" text-anchor="middle" fill="#5F6B7A">with 1 mm clear all round</text>
  <polyline points="722,539 722,565.8" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="722" cy="565.8" r="3" fill="#5F6B7A"/>

  <text x="470" y="466" font-size="13" font-weight="600" fill="#E8590C">Keep-out for the sled's electronics: x 4 to 185, out to y = 37</text>

  <text x="248.6" y="451.2" font-size="13" fill="#5F6B7A">Fourth magnet post, moved out of</text>
  <text x="248.6" y="467.2" font-size="13" fill="#5F6B7A">its corner: the sled drops in there</text>

  <text x="365.6" y="175.2" font-size="15" text-anchor="middle" fill="#1F2933">Wheel well</text>
  <text x="365.6" y="192.2" font-size="13" text-anchor="middle" fill="#5F6B7A">38 x 14, one of four</text>

  <text x="248.6" y="224" font-size="15" fill="#1F2933">Magnet post for the roof lid, one of four (magnets 6 dia x 3)</text>
  <text x="248.6" y="242" font-size="13" fill="#5F6B7A">Two in the far corners, one in the cab, one on the rear wall.</text>
  <polyline points="244.6,214 234.56,185.28" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="234.56" cy="185.28" r="3" fill="#5F6B7A"/>

  <text x="542" y="322" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2933">Empty cavity</text>
  <text x="542" y="342" font-size="13" text-anchor="middle" fill="#5F6B7A">x 2.4 to 226.6, y 37 to 124.6: 224.2 x 87.6 mm of open floor</text>
  <text x="542" y="359" font-size="13" text-anchor="middle" fill="#5F6B7A">(the two far-side wheel wells stand in it, below z = 36)</text>

  <text x="876" y="247.2" font-size="15" fill="#1F2933">Cab, from x = 185</text>
  <text x="876" y="264.2" font-size="13" fill="#5F6B7A">the front of the truck</text>
  <text x="188" y="337.2" font-size="15" text-anchor="end" fill="#1F2933">Rear wall</text>

  <text x="150" y="627" font-size="13" fill="#1F2933">U-channel, one at each end of the sled</text>
  <polyline points="229.16,615 229.16,587.76" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="229.16" cy="587.76" r="3" fill="#5F6B7A"/>
  <text x="420" y="627" font-size="13" fill="#1F2933">Window opening, 161 wide (the wall carries on above and below it)</text>
  <polyline points="549.56,615 549.56,602.88" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="549.56" cy="602.88" r="3" fill="#5F6B7A"/>

  <!-- ============ magnified 8 times: the stack at the serving wall, a slice x 175.5 to 182.5 ============
       px = 800 + 28.8 * (x - 175.5), py = 846.36 - 28.8 * y -->
  <polyline points="844.4,639 844.4,608.28" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="844.4" cy="608.28" r="3" fill="#5F6B7A"/>
  <text x="854.4" y="631" font-size="13" fill="#1F2933">Magnified 8 times</text>
  <rect x="800" y="639" width="201.6" height="216" fill="#FFFBF2"/>
  <g transform="translate(-4254.4 846.36) scale(28.8 -28.8)" fill="none">
    <!-- serving wall, y 0 to 2.4, from the window's edge at x = 177.6 -->
    <rect x="177.6" y="0" width="4.9" height="2.4" fill="#FFE8CC"/>
    <path d="M182.5 0 H177.6 V2.4 H182.5" stroke="#1F2933" stroke-width="0.0694" stroke-linejoin="round"/>
    <path d="M175.5 0 H177.6 M175.5 2.4 H177.6" stroke="#B8C0CC" stroke-width="0.0521" stroke-dasharray="0.2083 0.1736"/>
    <!-- screen glass, y 2.9 to 3.8, ends at x = 182.2 -->
    <rect x="175.5" y="2.9" width="6.7" height="0.9" fill="#E7F5FF"/>
    <path d="M175.5 2.9 H182.2 V3.8" stroke="#1971C2" stroke-width="0.0521"/>
    <!-- sled backboard, y 3.8 to 6.8 -->
    <rect x="175.5" y="3.8" width="7" height="3" fill="#FFD8A8"/>
    <path d="M175.5 3.8 H182.5 M175.5 6.8 H182.5" stroke="#1F2933" stroke-width="0.0521"/>
  </g>
  <rect x="800" y="639" width="201.6" height="216" fill="none" stroke="#5F6B7A" stroke-width="1"/>
  <g stroke="#5F6B7A" stroke-width="1.25">
    <line x1="1001.6" y1="846.36" x2="1008.6" y2="846.36"/>
    <line x1="1001.6" y1="777.24" x2="1008.6" y2="777.24"/>
    <line x1="1001.6" y1="762.84" x2="1008.6" y2="762.84"/>
    <line x1="1001.6" y1="736.92" x2="1008.6" y2="736.92"/>
    <line x1="1001.6" y1="650.52" x2="1008.6" y2="650.52"/>
  </g>
  <text x="1013.6" y="850.86" font-size="13" font-weight="600" fill="#1F2933">y = 0</text>
  <text x="1013.6" y="783.74" font-size="13" font-weight="600" fill="#1F2933">y = 2.4</text>
  <text x="1013.6" y="765.34" font-size="13" font-weight="600" fill="#1F2933">y = 2.9</text>
  <text x="1013.6" y="741.42" font-size="13" font-weight="600" fill="#1F2933">y = 3.8</text>
  <text x="1013.6" y="655.02" font-size="13" font-weight="600" fill="#1F2933">y = 6.8</text>

  <text x="786" y="698.22" font-size="13" text-anchor="end" fill="#1F2933">Sled backboard, 3 thick</text>
  <polyline points="792,693.72 820.16,693.72" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="820.16" cy="693.72" r="3" fill="#5F6B7A"/>
  <text x="786" y="754.38" font-size="13" text-anchor="end" fill="#1F2933">Screen glass, 0.91 thick</text>
  <polyline points="792,749.88 820.16,749.88" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="820.16" cy="749.88" r="3" fill="#5F6B7A"/>
  <text x="786" y="774.54" font-size="13" text-anchor="end" fill="#1F2933">Air gap, 0.5</text>
  <polyline points="792,770.04 820.16,770.04" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="820.16" cy="770.04" r="3" fill="#5F6B7A"/>
  <text x="786" y="800.46" font-size="13" text-anchor="end" fill="#1F2933">Window opening (edge chamfered 45°: not drawn)</text>
  <polyline points="792,795.96 831.68,795.96" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="831.68" cy="795.96" r="3" fill="#5F6B7A"/>
  <text x="786" y="830.7" font-size="13" text-anchor="end" fill="#1F2933">Serving wall, 2.4 thick</text>
  <polyline points="792,826.2 889.28,826.2" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="889.28" cy="826.2" r="3" fill="#5F6B7A"/>

  <!-- ============ legend, scale note ============ -->
  <rect x="40" y="657" width="26" height="13" fill="#FFE8CC" stroke="#1F2933" stroke-width="1.5"/>
  <text x="76" y="668" font-size="13" fill="#1F2933">Truck body: walls, U-channels, magnet posts</text>
  <rect x="40" y="677" width="26" height="13" fill="#FFD8A8" stroke="#1F2933" stroke-width="1.5"/>
  <text x="76" y="688" font-size="13" fill="#1F2933">Sled backboard and its standoffs</text>
  <line x1="40" y1="704" x2="66" y2="704" stroke="#1971C2" stroke-width="3.24"/>
  <text x="76" y="708" font-size="13" fill="#1F2933">Screen glass, at its true thickness</text>
  <line x1="40" y1="724" x2="66" y2="724" stroke="#B8C0CC" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="76" y="728" font-size="13" fill="#1F2933">Hidden edge or the edge of a zone</text>

  <text x="40" y="770" font-size="13" fill="#5F6B7A">Drawn to scale: 3.6 px = 1 mm. The magnified box is 8 times that.</text>
  <text x="40" y="812" font-size="13" fill="#5F6B7A">The thickness of the boards, the USB-C port and the U-channel</text>
  <text x="40" y="829" font-size="13" fill="#5F6B7A">walls, and the size of the adapter board and the posts, are</text>
  <text x="40" y="846" font-size="13" fill="#5F6B7A">drawn at likely sizes: measure the real parts before modelling.</text>
</svg>
