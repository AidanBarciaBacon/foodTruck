<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect width="1200" height="900" fill="#FFFBF2"/>
<defs>
  <!-- the one arrowhead every dimension line shares -->
  <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 z" fill="#5F6B7A"/>
  </marker>
</defs>
<text x="40" y="56" font-size="26" font-weight="700" fill="#1F2933">Close-up: how the screen sits behind the window</text>
<text x="40" y="84" font-size="15" fill="#5F6B7A">Two enlarged pieces of the cross-section, serving side on the left. Scale 20 px = 1 mm. Sizes in mm (inches in brackets).</text>

<!-- (a) TOP EDGE. px x = 225 + 20 * y, px y = 140 + 20 * (152.5 - z). Shows y -2..8, z 140..152.5 -->
<text x="40" y="122" font-size="15" fill="#1F2933" font-weight="700">(a) Top edge of the window</text>

<!-- Roof lid, z 149.6-152 -->
<rect x="225" y="150" width="160" height="48.000000000000114" fill="#FFE8CC"/>
<polyline points="385,150 225,150 225,198 385,198" fill="none" stroke="#1F2933" stroke-width="2" stroke-linejoin="round"/>

<!-- Serving wall above the window: inner edge at z = 143.5; the outer 1.5 of the wall chamfered 45 degrees, to z = 145 on the outside -->
<polygon points="225,198 273,198 273,320 255,320 225,290" fill="#FFE8CC" stroke="#1F2933" stroke-width="2" stroke-linejoin="round"/>

<!-- The corner the chamfer removes -->
<polyline points="225,290 225,320 255,320" fill="none" stroke="#C92A2A" stroke-width="1.5" stroke-dasharray="6 5"/>

<!-- Sled backboard: flat plate y 3.8-6.8 up to z = 148.5, no rim along the top -->
<polygon points="301,390 301,220 361,220 361,390" fill="#FFD8A8"/>
<polyline points="301,390 301,220 361,220 361,390" fill="none" stroke="#1F2933" stroke-width="2" stroke-linejoin="round"/>

<!-- Screen glass: y 2.9-3.8 (0.91 thick), top edge z = 147.7. Blue: the picture area, from z = 143 down -->
<rect x="283" y="236.00000000000023" width="18" height="153.99999999999977" fill="#E7F5FF"/>
<polyline points="283,390 283,236 301,236 301,390" fill="none" stroke="#1F2933" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="283" y1="330" x2="283" y2="390" stroke="#1971C2" stroke-width="3"/>
<line x1="283" y1="330" x2="301" y2="330" stroke="#1971C2" stroke-width="1.25"/>

<!-- Tape strip between the glass and the plate's flat front face -->
<rect x="299.7" y="260" width="3" height="60" fill="#E8590C"/>

<!-- A line of sight from above, at the slope drawn in the cross-section (65.5 px down in 257.05), to the top of the picture -->
<line x1="44" y1="269.1" x2="283" y2="330" stroke="#E8590C" stroke-width="1.75"/>
<text x="75" y="270" font-size="13" fill="#E8590C" transform="rotate(14.3 75 270)">Line of sight from above</text>

<!-- Dimensions -->
<line x1="273" y1="323" x2="273" y2="378" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="255" y1="372" x2="273" y2="372" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><line x1="301" y1="372" x2="283" y2="372" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="247" y="377" font-size="14" fill="#1F2933" text-anchor="end" font-weight="600">0.5 mm (0.02 in)</text>
<text x="247" y="394" font-size="13" fill="#5F6B7A" text-anchor="end">air gap, wall to glass</text>
<line x1="364" y1="220" x2="381" y2="220" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="304" y1="236" x2="381" y2="236" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="304" y1="330" x2="381" y2="330" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="376" y1="209" x2="376" y2="198" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><line x1="376" y1="209" x2="376" y2="220" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/>
<line x1="376" y1="283" x2="376" y2="236" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><line x1="376" y1="283" x2="376" y2="330" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/>

<!-- Labels -->
<text x="396" y="179" font-size="15" fill="#1F2933">Roof lid, 2.4 mm thick</text>
<path d="M392,174 L370,174" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="370" cy="174" r="1.5" fill="#5F6B7A"/>
<text x="396" y="214" font-size="14" fill="#1F2933" font-weight="600">1.1 mm (0.04 in)</text>
<text x="508" y="214" font-size="13" fill="#5F6B7A">sled to lid</text>
<text x="396" y="250" font-size="15" fill="#1F2933">No rim along the top: the</text>
<text x="396" y="269" font-size="15" fill="#1F2933">glass lies flat on the sled</text>
<path d="M392,245 L292,228" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="292" cy="228" r="1.5" fill="#5F6B7A"/>
<text x="396" y="300" font-size="14" fill="#1F2933" font-weight="600">4.7 mm (0.19 in)</text>
<text x="396" y="317" font-size="13" fill="#5F6B7A">dead border over the picture</text>
<text x="396" y="351" font-size="15" fill="#1F2933">Thin double-sided tape:</text>
<text x="396" y="370" font-size="15" fill="#1F2933">all that holds the glass</text>
<path d="M392,346 L302.5,312" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="302.5" cy="312" r="1.5" fill="#5F6B7A"/>
<text x="215" y="150" font-size="15" fill="#1F2933" text-anchor="end">Serving wall,</text>
<text x="215" y="169" font-size="15" fill="#1F2933" text-anchor="end">2.4 mm thick</text>
<path d="M202,176 L251,246" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="251" cy="246" r="1.5" fill="#5F6B7A"/>
<text x="40" y="198" font-size="13" fill="#5F6B7A">Outer 1.5 mm of the wall</text>
<text x="40" y="214" font-size="13" fill="#5F6B7A">chamfered 45°. A square</text>
<text x="40" y="230" font-size="13" fill="#5F6B7A">edge (red dashes) would</text>
<text x="40" y="246" font-size="13" fill="#5F6B7A">hide the picture's top</text>
<path d="M192,226 L225,300" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="225" cy="300" r="1.5" fill="#5F6B7A"/>
<text x="258" y="418" font-size="15" fill="#1F2933" text-anchor="end">Picture area (blue edge)</text>
<path d="M262,412 L283,386" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="283" cy="386" r="1.5" fill="#5F6B7A"/>
<text x="286" y="447" font-size="15" fill="#1F2933" text-anchor="end">Screen glass, 0.91 mm thick</text>
<path d="M290,442 L292,442 L292,384" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="292" cy="384" r="1.5" fill="#5F6B7A"/>
<text x="352" y="418" font-size="15" fill="#1F2933">Sled backboard, 3 mm thick</text>
<path d="M348,412 L331,384" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="331" cy="384" r="1.5" fill="#5F6B7A"/>

<!-- Notes -->
<text x="40" y="486" font-size="13" fill="#5F6B7A">Only the outer 1.5 mm of the wall is chamfered; the inner 0.9 mm</text>
<text x="40" y="503" font-size="13" fill="#5F6B7A">stays square. A shallow look from above clears it; a steep one</text>
<text x="40" y="520" font-size="13" fill="#5F6B7A">loses a sliver at the top of the picture behind that square edge.</text>
<text x="40" y="537" font-size="13" fill="#5F6B7A">No lid lip on this side: it would reach z = 148.1, below the</text>
<text x="40" y="554" font-size="13" fill="#5F6B7A">sled's top (148.5). A 1 mm rim at the plate's two ends, not</text>
<text x="40" y="571" font-size="13" fill="#5F6B7A">drawn here, locates the glass.</text>

<!-- Key -->
<rect x="40" y="589" width="22" height="13" fill="#FFE8CC" stroke="#1F2933" stroke-width="1.5"/><text x="70" y="600" font-size="13" fill="#5F6B7A">Truck body</text>
<rect x="150" y="589" width="22" height="13" fill="#FFD8A8" stroke="#1F2933" stroke-width="1.5"/><text x="180" y="600" font-size="13" fill="#5F6B7A">Sled</text>
<rect x="222" y="589" width="22" height="13" fill="#E7F5FF" stroke="#1F2933" stroke-width="1.5"/><text x="252" y="600" font-size="13" fill="#5F6B7A">Screen glass</text>
<rect x="340" y="589" width="22" height="13" fill="#D3F9D8" stroke="#2F9E44" stroke-width="1.5"/><text x="370" y="600" font-size="13" fill="#5F6B7A">Board</text>
<line x1="40" y1="618" x2="62" y2="618" stroke="#E8590C" stroke-width="3"/>
<text x="70" y="623" font-size="13" fill="#5F6B7A">Tape, and the ribbon where it may bend</text>
<line x1="40" y1="638" x2="62" y2="638" stroke="#1971C2" stroke-width="3"/>
<text x="70" y="643" font-size="13" fill="#5F6B7A">Picture area edge, and the ribbon where it stays straight</text>

<!-- (b) BOTTOM EDGE, cut at the middle of the ribbon. px x = 720 + 20 * y, px y = 135 + 20 * (57.5 - z). Shows y -2..12.5, z 33..57.5 -->
<text x="580" y="122" font-size="15" fill="#1F2933" font-weight="700">(b) Bottom edge of the window, at the ribbon</text>

<!-- Wheel-well roof, z 33.6-36 (beyond: the cut-out is between the wells). The sled stands on its top -->
<line x1="768" y1="565" x2="970" y2="565" stroke="#B8C0CC" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="768" y1="613" x2="970" y2="613" stroke="#B8C0CC" stroke-width="1.5" stroke-dasharray="6 5"/>

<!-- Serving wall below the window: inner edge at z = 46.5; the outer 1.5 of the wall chamfered 45 degrees, to z = 45 on the outside -->
<polygon points="720,625 720,385 750,355 768,355 768,625" fill="#FFE8CC"/>
<polyline points="720,625 720,385 750,355 768,355 768,625" fill="none" stroke="#1F2933" stroke-width="2" stroke-linejoin="round"/>

<!-- Sled backboard, cut: plate y 3.8-6.8 from z = 42 up. Below it the cut-out, 6 tall; the plate carries on beyond (dashed) -->
<polygon points="796,135 796,445 856,445 856,135" fill="#FFD8A8"/>
<polyline points="796,135 796,445 856,445 856,135" fill="none" stroke="#1F2933" stroke-width="2" stroke-linejoin="round"/>
<polyline points="796,445 796,565" fill="none" stroke="#B8C0CC" stroke-width="1.5" stroke-dasharray="6 5"/>
<polyline points="856,445 856,565" fill="none" stroke="#B8C0CC" stroke-width="1.5" stroke-dasharray="6 5"/>

<!-- Screen glass: y 2.9-3.8 (0.91 thick), bottom edge z = 36.5. Blue: the picture area, from z = 47 up -->
<rect x="778" y="135" width="18" height="420" fill="#E7F5FF"/>
<polyline points="778,135 778,555 796,555 796,135" fill="none" stroke="#1F2933" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="778" y1="135" x2="778" y2="345" stroke="#1971C2" stroke-width="3"/>
<line x1="778" y1="345" x2="796" y2="345" stroke="#1971C2" stroke-width="1.25"/>

<!-- Glue bump on the back of the glass at the ribbon: 1.2 high (to y = 5.0) -->
<path d="M796,555 C828,555 828,495 796,495 z" fill="#B8C0CC" stroke="#5F6B7A" stroke-width="1.25"/>

<!-- Adapter board (z 50 up) and its socket (y 6.8-8.8, z 51-56) -->
<polygon points="896,135 896,285 928,285 928,135" fill="#D3F9D8"/>
<polyline points="896,135 896,285 928,285 928,135" fill="none" stroke="#2F9E44" stroke-width="2" stroke-linejoin="round"/>
<rect x="856" y="165" width="40" height="100" fill="#D3F9D8" stroke="#2F9E44" stroke-width="2" stroke-linejoin="round"/>

<!-- Ribbon: half-turn of 1.75 radius = 5.5 long (orange, the bend zone), then straight up at y = 7.3 (3.8 + 2 x 1.75) to its end at z = 55 -->
<path d="M796,555 A35,35 0 0 0 866,555" fill="none" stroke="#E8590C" stroke-width="4"/>
<line x1="866" y1="555" x2="866" y2="265" stroke="#1971C2" stroke-width="4"/>
<line x1="866" y1="265" x2="866" y2="185" stroke="#1971C2" stroke-width="2.5" stroke-dasharray="4 3"/>

<!-- Radius of the U -->
<path d="M827.2,555 h8 M831.2,551 v8" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="831.2" y1="555" x2="852.41" y2="580.28" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/>

<!-- Dimensions -->
<line x1="775" y1="345" x2="682" y2="345" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="717" y1="555" x2="682" y2="555" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="687" y1="450" x2="687" y2="345" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><line x1="687" y1="450" x2="687" y2="555" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="615.28" y="413" width="131.43" height="16" fill="#FFFBF2" transform="rotate(-90 681 425)"/><text x="681" y="425" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle" transform="rotate(-90 681 425)">10.5 mm (0.41 in)</text>
<text x="664" y="412" font-size="13" fill="#5F6B7A" text-anchor="end">dead border</text>
<text x="664" y="429" font-size="13" fill="#5F6B7A" text-anchor="end">under the picture</text>
<line x1="859" y1="445" x2="951" y2="445" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="931" y1="245" x2="951" y2="245" stroke="#5F6B7A" stroke-width="1.25"/>
<line x1="946" y1="505" x2="946" y2="445" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><line x1="946" y1="505" x2="946" y2="565" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/>
<line x1="946" y1="345" x2="946" y2="245" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/><line x1="946" y1="345" x2="946" y2="445" stroke="#5F6B7A" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="956" y="262" font-size="14" fill="#1F2933" font-weight="600">within 10 mm (0.39 in)</text>
<text x="956" y="279" font-size="13" fill="#5F6B7A">socket above the cut-out</text>
<text x="956" y="548" font-size="14" fill="#1F2933" font-weight="600">6 mm (0.24 in)</text>

<!-- Labels -->
<text x="672" y="190" font-size="15" fill="#1F2933" text-anchor="end">Screen glass</text>
<path d="M677,185 L787,185" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="787" cy="185" r="1.5" fill="#5F6B7A"/>
<text x="672" y="240" font-size="15" fill="#1F2933" text-anchor="end">Picture area</text>
<text x="672" y="259" font-size="15" fill="#1F2933" text-anchor="end">(blue edge)</text>
<path d="M677,235 L778,235" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="778" cy="235" r="1.5" fill="#5F6B7A"/>
<text x="450" y="492" font-size="15" fill="#1F2933">Serving wall, 2.4 mm thick,</text>
<text x="450" y="511" font-size="15" fill="#1F2933">outer 1.5 mm chamfered 45°</text>
<path d="M648,487 L744,487" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="744" cy="487" r="1.5" fill="#5F6B7A"/>
<text x="450" y="540" font-size="15" fill="#1F2933">Bend zone (orange): a relaxed</text>
<text x="450" y="559" font-size="15" fill="#1F2933">U of about 2 mm (0.08 in)</text>
<text x="450" y="578" font-size="15" fill="#1F2933">radius. Only this 5.5 mm</text>
<text x="450" y="597" font-size="15" fill="#1F2933">(0.22 in) of ribbon may bend</text>
<path d="M668,583 L806.46,579.75" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="806.46" cy="579.75" r="1.5" fill="#5F6B7A"/>
<text x="978" y="150" font-size="15" fill="#1F2933">Adapter board</text>
<path d="M974,145 L912,145" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="912" cy="145" r="1.5" fill="#5F6B7A"/>
<text x="978" y="190" font-size="15" fill="#1F2933">Socket: the ribbon's</text>
<text x="978" y="209" font-size="15" fill="#1F2933">end pushes in here</text>
<path d="M974,195 L878,205" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="878" cy="205" r="1.5" fill="#5F6B7A"/>
<text x="978" y="322" font-size="15" fill="#1F2933">Ribbon cable: straight</text>
<text x="978" y="341" font-size="15" fill="#1F2933">from here up, no bends</text>
<path d="M974,327 L868,345" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="868" cy="345" r="1.5" fill="#5F6B7A"/>
<text x="978" y="388" font-size="15" fill="#1F2933">Sled backboard</text>
<path d="M974,383 L826,393" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="826" cy="393" r="1.5" fill="#5F6B7A"/>
<text x="978" y="428" font-size="15" fill="#1F2933">Cut-out in the sled,</text>
<text x="978" y="447" font-size="15" fill="#1F2933">30 mm wide x 6 mm tall</text>
<path d="M974,433 L838,470" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="838" cy="470" r="1.5" fill="#5F6B7A"/>
<text x="978" y="490" font-size="15" fill="#1F2933">Glue bump on the glass,</text>
<text x="978" y="509" font-size="15" fill="#1F2933">up to 1.2 mm high</text>
<path d="M974,495 L810,525" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="810" cy="525" r="1.5" fill="#5F6B7A"/>
<text x="978" y="574" font-size="15" fill="#1F2933">Wheel-well roof, z 33.6</text>
<text x="978" y="593" font-size="15" fill="#1F2933">to 36 (dashed: beyond):</text>
<text x="978" y="612" font-size="15" fill="#1F2933">the sled stands on it</text>
<path d="M974,573 L962,565" fill="none" stroke="#5F6B7A" stroke-width="1.25"/><circle cx="962" cy="565" r="1.5" fill="#5F6B7A"/>

<!-- DO / DON'T strip -->
<text x="40" y="680" font-size="15" fill="#1F2933" font-weight="700">Do and don't</text>
<rect x="40" y="696" width="269.5" height="142" rx="6" fill="#FFFBF2" stroke="#B8C0CC" stroke-width="1.5"/>
<path d="M56,730 l8,9 l14,-19" fill="none" stroke="#1F2933" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="90" y="726" font-size="15" fill="#1F2933" font-weight="700">Do leave the 0.5 mm gap</text>
<text x="90" y="745" font-size="15" fill="#1F2933" font-weight="700">and let tape hold the glass</text>
<text x="58" y="782" font-size="13" fill="#5F6B7A">The wall is only a frame in front of</text>
<text x="58" y="801" font-size="13" fill="#5F6B7A">the glass and never touches it. Tape</text>
<text x="58" y="820" font-size="13" fill="#5F6B7A">on the back is the whole mount.</text>
<rect x="323.5" y="696" width="269.5" height="142" rx="6" fill="#FFFBF2" stroke="#B8C0CC" stroke-width="1.5"/>
<path d="M340.5,720 l18,18 M358.5,720 l-18,18" fill="none" stroke="#C92A2A" stroke-width="3.5" stroke-linecap="round"/>
<text x="373.5" y="726" font-size="15" fill="#1F2933" font-weight="700">Don't clamp or press</text>
<text x="373.5" y="745" font-size="15" fill="#1F2933" font-weight="700">on the glass</text>
<text x="341.5" y="782" font-size="13" fill="#5F6B7A">No clips, screws or tight rims: the</text>
<text x="341.5" y="801" font-size="13" fill="#5F6B7A">two end rims only locate it. Bare</text>
<text x="341.5" y="820" font-size="13" fill="#5F6B7A">glass cracks under a squeeze.</text>
<rect x="607" y="696" width="269.5" height="142" rx="6" fill="#FFFBF2" stroke="#B8C0CC" stroke-width="1.5"/>
<path d="M624,720 l18,18 M642,720 l-18,18" fill="none" stroke="#C92A2A" stroke-width="3.5" stroke-linecap="round"/>
<text x="657" y="726" font-size="15" fill="#1F2933" font-weight="700">Don't crease the ribbon</text>
<text x="657" y="745" font-size="15" fill="#1F2933" font-weight="700">or bend it past the zone</text>
<text x="625" y="782" font-size="13" fill="#5F6B7A">One relaxed U, nothing sharper, and</text>
<text x="625" y="801" font-size="13" fill="#5F6B7A">only in the 5.5 mm next to the</text>
<text x="625" y="820" font-size="13" fill="#5F6B7A">glass. Past that it stays straight.</text>
<rect x="890.5" y="696" width="269.5" height="142" rx="6" fill="#FFFBF2" stroke="#B8C0CC" stroke-width="1.5"/>
<path d="M907.5,720 l18,18 M925.5,720 l-18,18" fill="none" stroke="#C92A2A" stroke-width="3.5" stroke-linecap="round"/>
<text x="940.5" y="726" font-size="15" fill="#1F2933" font-weight="700">Don't stand the sled</text>
<text x="940.5" y="745" font-size="15" fill="#1F2933" font-weight="700">on its ribbon</text>
<text x="908.5" y="782" font-size="13" fill="#5F6B7A">The U hangs below the sled's bottom</text>
<text x="908.5" y="801" font-size="13" fill="#5F6B7A">edge. On the bench lay the sled face</text>
<text x="908.5" y="820" font-size="13" fill="#5F6B7A">up, or sit it in a printed stand.</text>
